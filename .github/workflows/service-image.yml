# yamllint disable rule:line-length
name: Service image

on:
  push:
    tags: ['2.*']

permissions:
  contents: read

jobs:
  smoke:
    name: Self-contained service image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Exercise service mode through the PHP SDK
        run: scripts/ci/service-mode-image-smoke.sh

  publish:
    name: Publish versioned service image
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/2.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-plan-publication
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve the checked-out release source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable version tag
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          build-args: |
            WATERLINE_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: durableworkflow/waterline:${{ github.ref_name }}
      - name: Smoke the published image
        env:
          SERVICE_IMAGE_SKIP_BUILD: '1'
          WATERLINE_IMAGE: durableworkflow/waterline:${{ github.ref_name }}
        run: scripts/ci/service-mode-image-smoke.sh
