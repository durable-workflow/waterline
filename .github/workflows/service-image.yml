# yamllint disable rule:line-length
name: Service image

on:
  push:
    tags: ['2.*']

permissions:
  contents: read

env:
  SERVICE_IMAGE_CACHE: durableworkflow/waterline:buildcache-v1
  SERVICE_IMAGE_ARM_CACHE: durableworkflow/waterline:buildcache-arm64-v1
  SERVICE_IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  qualify-release-source:
    name: Qualify exact current release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Reject stale dependency identities before publication
        run: >-
          python scripts/ci/waterline_release_identity.py
          --approved-tuple release/current-product-tuple.json
          --waterline-composer composer.json
          --standalone-composer standalone/composer.json
          --standalone-lock standalone/composer.lock
          --release-version "$GITHUB_REF_NAME"
          --evidence waterline-release-identity-evidence.json

  smoke:
    name: Self-contained service image smoke
    needs: qualify-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Exercise service mode through the PHP SDK
        run: scripts/ci/service-mode-image-smoke.sh

  prewarm_arm64:
    name: Build native arm64 publication cache
    needs: [qualify-release-source, smoke]
    if: startsWith(github.ref, 'refs/tags/2.')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: release-publication
    outputs:
      build_seconds: ${{ steps.elapsed.outputs.seconds }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve the checked-out release source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Start native arm64 build timer
        id: started
        run: printf 'epoch_seconds=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build native arm64 cache from exact release source
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          build-args: |
            WATERLINE_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          platforms: linux/arm64
          pull: true
          push: false
          cache-from: type=registry,ref=${{ env.SERVICE_IMAGE_ARM_CACHE }}
          cache-to: type=registry,ref=${{ env.SERVICE_IMAGE_ARM_CACHE }},mode=max
      - name: Record native arm64 build duration
        id: elapsed
        env:
          STARTED_AT: ${{ steps.started.outputs.epoch_seconds }}
        run: printf 'seconds=%s\n' "$(( $(date +%s) - STARTED_AT ))" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish versioned service image
    needs: [qualify-release-source, smoke, prewarm_arm64]
    if: startsWith(github.ref, 'refs/tags/2.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publication
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve the checked-out release source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Match the native arm64 cache to this release source
        env:
          NATIVE_SOURCE_COMMIT: ${{ needs.prewarm_arm64.outputs.source_commit }}
          RELEASE_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: test "$NATIVE_SOURCE_COMMIT" = "$RELEASE_SOURCE_COMMIT"
      - name: Resolve the protected publication cache
        id: cache
        env:
          CACHE_REF: ${{ env.SERVICE_IMAGE_CACHE }}
        run: |
          set -euo pipefail
          cache_state=cold
          cache_from=
          if docker buildx imagetools inspect "$CACHE_REF" >/dev/null 2>&1; then
            cache_state=warm
            cache_from="type=registry,ref=$CACHE_REF"
          fi
          {
            printf 'ref=%s\n' "$CACHE_REF"
            printf 'state=%s\n' "$cache_state"
            printf 'cache_from=%s\n' "$cache_from"
            printf 'cache_to=type=registry,ref=%s,mode=max,ignore-error=true\n' "$CACHE_REF"
          } >> "$GITHUB_OUTPUT"
      - name: Start multi-architecture build timer
        id: build_started
        run: printf 'epoch_seconds=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable version tag
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          build-args: |
            WATERLINE_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          platforms: ${{ env.SERVICE_IMAGE_PLATFORMS }}
          pull: true
          push: true
          tags: durableworkflow/waterline:${{ github.ref_name }}
          cache-from: |
            ${{ steps.cache.outputs.cache_from }}
            type=registry,ref=${{ env.SERVICE_IMAGE_ARM_CACHE }}
          cache-to: ${{ steps.cache.outputs.cache_to }}
      - name: Record protected build timing evidence
        id: timing
        if: ${{ always() && steps.build_started.outputs.epoch_seconds != '' }}
        env:
          BUILD_STARTED_AT: ${{ steps.build_started.outputs.epoch_seconds }}
          BUILD_OUTCOME: ${{ steps.publish.outcome || 'skipped' }}
          CACHE_REF: ${{ steps.cache.outputs.ref }}
          CACHE_STATE: ${{ steps.cache.outputs.state }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SERVICE_IMAGE_PLATFORMS: ${{ env.SERVICE_IMAGE_PLATFORMS }}
          NATIVE_ARM_PREWARM_SECONDS: ${{ needs.prewarm_arm64.outputs.build_seconds }}
          UNCACHED_BASELINE_FLOOR_SECONDS: 600
          WARM_CACHE_TARGET_SECONDS: 600
        run: node scripts/ci/record-service-image-build-timing.mjs
      - name: Smoke the published image
        id: published_smoke
        if: ${{ always() && steps.publish.outcome == 'success' && steps.timing.outcome == 'success' }}
        env:
          SERVICE_IMAGE_SKIP_BUILD: '1'
          WATERLINE_IMAGE: durableworkflow/waterline:${{ github.ref_name }}
          EXPECTED_WATERLINE_VERSION: ${{ github.ref_name }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: scripts/ci/service-mode-image-smoke.sh
      - name: Enforce the warm-cache release budget
        if: >-
          ${{
            always() &&
            steps.publish.outcome == 'success' &&
            steps.timing.outcome == 'success' &&
            steps.cache.outputs.state == 'warm'
          }}
        env:
          MEETS_REPEAT_BUDGET: ${{ steps.timing.outputs.meets_repeat_budget }}
        run: test "$MEETS_REPEAT_BUDGET" = true
      - name: Retain protected build timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: waterline-service-image-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: service-image-build-evidence.json
          if-no-files-found: warn
