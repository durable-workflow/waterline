name: Build unprivileged native release artifacts

on:
  push:
    tags: ['2.*']
  workflow_dispatch:
    inputs:
      source_commit:
        description: Immutable source commit for an unprivileged qualification or main recovery build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-oci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Build and test native OCI (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    env:
      RELEASE_VERSION: '2.18.1'
      SOURCE_INPUT: ${{ inputs.source_commit }}
      EXPECTED_PLATFORM: linux/${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Select authenticated tool trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7 # clean-trust
        with:
          clients: python,curl,git
      - name: Bind the immutable candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          source_commit="$SOURCE_INPUT"
          if [[ "$GITHUB_EVENT_NAME" = push ]]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_VERSION"
            source_commit="$GITHUB_SHA"
          fi
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$source_commit"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$source_commit"
          candidate_root="$RUNNER_TEMP/waterline-candidate"
          mkdir -p "$candidate_root" "$RUNNER_TEMP/native-oci"
          git archive "$source_commit" | tar -x -C "$candidate_root"
          {
            printf 'commit=%s\n' "$source_commit"
            printf 'tree=%s\n' "$(git rev-parse "$source_commit^{tree}")"
          } >> "$GITHUB_OUTPUT"
          printf 'CANDIDATE_ROOT=%s\n' "$candidate_root" >> "$GITHUB_ENV"
      - name: Validate candidate release identities without credentials
        working-directory: ${{ env.CANDIDATE_ROOT }}
        run: >-
          python scripts/ci/waterline_release_identity.py
          --approved-tuple release/current-product-tuple.json
          --waterline-composer composer.json
          --standalone-composer standalone/composer.json
          --standalone-lock standalone/composer.lock
          --release-version "$RELEASE_VERSION"
          --evidence "$RUNNER_TEMP/native-oci/source-identity.json"
      - name: Install the distribution OCI copy tool
        # CVE-2026-109518 needs APT to retry a redirected download; hosted
        # runner images still ship affected apt (durable-workflow/.github#295).
        run: |
          echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version
      - name: Isolate anonymous Docker configuration
        run: |
          anonymous_config="$RUNNER_TEMP/native-anonymous-docker"
          mkdir -p "$anonymous_config"
          printf '%s\n' '{}' > "$anonymous_config/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$anonymous_config" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build native OCI without registry credentials or cache writes
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ env.CANDIDATE_ROOT }}
          build-args: |
            WATERLINE_VERSION=${{ env.RELEASE_VERSION }}
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          platforms: ${{ env.EXPECTED_PLATFORM }}
          pull: true
          no-cache: true
          push: false
          # Public per-platform provenance travels inside the OCI archive as
          # one attestation manifest per image; the publisher verifies and
          # copies it with the image.
          provenance: mode=max,version=v1
          # buildkit-syft-scanner 1.12.1, pinned by index digest.
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
          outputs: type=oci,dest=${{ runner.temp }}/native-oci/image.oci.tar,oci-mediatypes=true
      - name: Scan the exact native OCI before acceptance
        shell: bash
        run: |
          set -euo pipefail
          scanner="$(python -c 'import json; print(json.load(open("release/service-image-security.json"))["scanner_image"])')"
          python -I scripts/ci/oci_release.py scan-layout \
            --archive "$RUNNER_TEMP/native-oci/image.oci.tar" \
            --directory "$RUNNER_TEMP/native-oci/scan-layout" \
            --architecture "${{ matrix.architecture }}" --source "${{ steps.source.outputs.commit }}"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/native-oci,dst=/scan" \
            "$scanner" image --input /scan/scan-layout --platform "${{ env.EXPECTED_PLATFORM }}" \
            --cache-dir /scan/security-cache --scanners vuln --list-all-pkgs \
            --no-progress --format json --output /scan/security-report.json
          python -I scripts/ci/oci_release.py scan \
            --report "$RUNNER_TEMP/native-oci/security-report.json" \
            --database "$RUNNER_TEMP/native-oci/security-cache/db/metadata.json" \
            --archive "$RUNNER_TEMP/native-oci/image.oci.tar" \
            --architecture "${{ matrix.architecture }}" \
            --output "$RUNNER_TEMP/native-oci/security-summary.json"
      - name: Import and exercise that exact OCI image without credentials
        id: ordinary
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          image="waterline-native-test:$GITHUB_RUN_ID-${{ matrix.architecture }}"
          skopeo copy "oci-archive:$RUNNER_TEMP/native-oci/image.oci.tar" "docker-daemon:$image"
          python3 -I -S - <<'PY'
          """Canonical first-stage source for the reviewed ordinary workflow run block.

          This file is not an executable entrypoint. Activation must put these literal
          bytes in the existing trusted workflow step, with one explicit launch call.
          Executing a later mutable copy of this file supplies no launch authority.
          """

          import hashlib
          import os
          from pathlib import Path
          import stat
          import signal


          BOOTSTRAP_SHA256 = "6206b9022a0f8a30ab84579d5aedeaebb5f2f9243ad0eecc52f5152727f465e5"


          def identity(value):
              return tuple(getattr(value, key) for key in ("st_dev", "st_ino", "st_mode", "st_uid", "st_gid", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns"))


          def root_descriptor(path: Path) -> int:
              if not path.is_absolute() or ".." in path.parts:
                  raise RuntimeError("First-stage root must be an absolute no-follow directory")
              descriptor = os.open("/", os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC)
              try:
                  for component in path.parts[1:]:
                      child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=descriptor)
                      os.close(descriptor)
                      descriptor = child
                      state = os.fstat(descriptor)
                      if not stat.S_ISDIR(state.st_mode) or state.st_uid not in {0, os.getuid()} or state.st_mode & 0o022:
                          raise RuntimeError("First-stage root has an unselected owner or write boundary")
                  return descriptor
              except BaseException:
                  os.close(descriptor)
                  raise


          def bootstrap_bytes(root: int) -> bytes:
              parent = os.dup(root)
              try:
                  for component in ("scripts", "ci"):
                      child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent)
                      os.close(parent)
                      parent = child
                      state = os.fstat(parent)
                      if state.st_uid not in {0, os.getuid()} or state.st_mode & 0o022:
                          raise RuntimeError("First-stage source ancestor is writable by another principal")
                  descriptor = os.open("service_smoke_bootstrap.py", os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent)
                  try:
                      before = os.fstat(descriptor)
                      if (not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid not in {0, os.getuid()}
                              or before.st_mode & 0o022 or not 0 < before.st_size <= 1024 * 1024):
                          raise RuntimeError("First-stage source must be one bounded owned regular file")
                      raw = os.read(descriptor, 1024 * 1024 + 1)
                      if (len(raw) != before.st_size or identity(os.fstat(descriptor)) != identity(before)
                              or hashlib.sha256(raw).hexdigest() != BOOTSTRAP_SHA256):
                          raise RuntimeError("First-stage source substituted before compilation")
                      return raw
                  finally:
                      os.close(descriptor)
              finally:
                  os.close(parent)


          def launch(root: Path, method: str, arguments: dict | None = None):
              selected = {"native": set(), "published": {"producer_gate_succeeded"}, "cleanup": {"contexts"}}
              arguments = {} if arguments is None else arguments
              if method not in selected or not isinstance(arguments, dict) or set(arguments) != selected[method]:
                  raise RuntimeError("Unselected ordinary first-stage call")
              descriptor = root_descriptor(root)
              previous = {}
              try:
                  raw = bootstrap_bytes(descriptor)
                  namespace = {"__name__": "waterline_verified_invocation", "__file__": "<verified ordinary invocation>",
                               "__verified_source__": raw, "__verified_root__": str(root), "__verified_root_fd__": descriptor}

                  def scope_check():
                      if namespace.get("__ordinary_cancelled__") is True:
                          raise InterruptedError("Ordinary work was cancelled; only owned cleanup remains available")

                  def interrupted(number, _frame):
                      namespace["__ordinary_cancelled__"] = True
                      signal.signal(number, signal.SIG_IGN)
                      raise InterruptedError("Ordinary invocation interrupted")

                  namespace["__scope_check__"] = scope_check
                  for number in (signal.SIGINT, signal.SIGTERM):
                      previous[number] = signal.getsignal(number)
                      signal.signal(number, interrupted)
                  exec(compile(raw, "<verified ordinary invocation>", "exec"), namespace)
                  return namespace[method](**arguments)
              finally:
                  for number, handler in previous.items():
                      signal.signal(number, handler)
                  os.close(descriptor)

          launch(Path(os.environ["GITHUB_WORKSPACE"]), "native")
          PY
          python -I scripts/ci/oci_release.py native \
            --archive "$RUNNER_TEMP/native-oci/image.oci.tar" \
            --security "$RUNNER_TEMP/native-oci/security-summary.json" \
            --sdk "$RUNNER_TEMP/native-oci/sdk.json" --workflow .github/workflows/service-image.yml \
            --version "$RELEASE_VERSION" --source "$SOURCE_COMMIT" --tree "${{ steps.source.outputs.tree }}" \
            --architecture "${{ matrix.architecture }}" --image-id "$(docker image inspect --format '{{.Id}}' "$image")" \
            --output "$RUNNER_TEMP/native-oci/provenance.json"
      - name: Independently remove owned ordinary acceptance roles
        if: >-
          always() && steps.ordinary.outputs.ordinary_code_root != '' &&
          (steps.ordinary.outputs.ordinary_native_run != '')
        env:
          ORDINARY_CODE_ROOT: ${{ steps.ordinary.outputs.ordinary_code_root }}
          ORDINARY_NATIVE_RUN: ${{ steps.ordinary.outputs.ordinary_native_run }}
          ORDINARY_NATIVE_IMAGE: ${{ steps.ordinary.outputs.ordinary_native_image }}
          ORDINARY_NATIVE_ARCHITECTURE: ${{ steps.ordinary.outputs.ordinary_native_architecture }}
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          """Canonical first-stage source for the reviewed ordinary workflow run block.

          This file is not an executable entrypoint. Activation must put these literal
          bytes in the existing trusted workflow step, with one explicit launch call.
          Executing a later mutable copy of this file supplies no launch authority.
          """

          import hashlib
          import os
          from pathlib import Path
          import stat
          import signal


          BOOTSTRAP_SHA256 = "6206b9022a0f8a30ab84579d5aedeaebb5f2f9243ad0eecc52f5152727f465e5"


          def identity(value):
              return tuple(getattr(value, key) for key in ("st_dev", "st_ino", "st_mode", "st_uid", "st_gid", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns"))


          def root_descriptor(path: Path) -> int:
              if not path.is_absolute() or ".." in path.parts:
                  raise RuntimeError("First-stage root must be an absolute no-follow directory")
              descriptor = os.open("/", os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC)
              try:
                  for component in path.parts[1:]:
                      child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=descriptor)
                      os.close(descriptor)
                      descriptor = child
                      state = os.fstat(descriptor)
                      if not stat.S_ISDIR(state.st_mode) or state.st_uid not in {0, os.getuid()} or state.st_mode & 0o022:
                          raise RuntimeError("First-stage root has an unselected owner or write boundary")
                  return descriptor
              except BaseException:
                  os.close(descriptor)
                  raise


          def bootstrap_bytes(root: int) -> bytes:
              parent = os.dup(root)
              try:
                  for component in ("scripts", "ci"):
                      child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent)
                      os.close(parent)
                      parent = child
                      state = os.fstat(parent)
                      if state.st_uid not in {0, os.getuid()} or state.st_mode & 0o022:
                          raise RuntimeError("First-stage source ancestor is writable by another principal")
                  descriptor = os.open("service_smoke_bootstrap.py", os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent)
                  try:
                      before = os.fstat(descriptor)
                      if (not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid not in {0, os.getuid()}
                              or before.st_mode & 0o022 or not 0 < before.st_size <= 1024 * 1024):
                          raise RuntimeError("First-stage source must be one bounded owned regular file")
                      raw = os.read(descriptor, 1024 * 1024 + 1)
                      if (len(raw) != before.st_size or identity(os.fstat(descriptor)) != identity(before)
                              or hashlib.sha256(raw).hexdigest() != BOOTSTRAP_SHA256):
                          raise RuntimeError("First-stage source substituted before compilation")
                      return raw
                  finally:
                      os.close(descriptor)
              finally:
                  os.close(parent)


          def launch(root: Path, method: str, arguments: dict | None = None):
              selected = {"native": set(), "published": {"producer_gate_succeeded"}, "cleanup": {"contexts"}}
              arguments = {} if arguments is None else arguments
              if method not in selected or not isinstance(arguments, dict) or set(arguments) != selected[method]:
                  raise RuntimeError("Unselected ordinary first-stage call")
              descriptor = root_descriptor(root)
              previous = {}
              try:
                  raw = bootstrap_bytes(descriptor)
                  namespace = {"__name__": "waterline_verified_invocation", "__file__": "<verified ordinary invocation>",
                               "__verified_source__": raw, "__verified_root__": str(root), "__verified_root_fd__": descriptor}

                  def scope_check():
                      if namespace.get("__ordinary_cancelled__") is True:
                          raise InterruptedError("Ordinary work was cancelled; only owned cleanup remains available")

                  def interrupted(number, _frame):
                      namespace["__ordinary_cancelled__"] = True
                      signal.signal(number, signal.SIG_IGN)
                      raise InterruptedError("Ordinary invocation interrupted")

                  namespace["__scope_check__"] = scope_check
                  for number in (signal.SIGINT, signal.SIGTERM):
                      previous[number] = signal.getsignal(number)
                      signal.signal(number, interrupted)
                  exec(compile(raw, "<verified ordinary invocation>", "exec"), namespace)
                  return namespace[method](**arguments)
              finally:
                  for number, handler in previous.items():
                      signal.signal(number, handler)
                  os.close(descriptor)

          contexts = []
          if os.environ['ORDINARY_NATIVE_RUN']:
              contexts.append({key: os.environ['ORDINARY_NATIVE_' + key.upper()] for key in ("run", "image", "architecture")})
          launch(Path(os.environ["ORDINARY_CODE_ROOT"]), "cleanup", {"contexts": contexts})
          PY
      - name: Retain immutable native OCI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: waterline-oci-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-oci/image.oci.tar
            ${{ runner.temp }}/native-oci/provenance.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
