name: Release Docs Audit

on:
  schedule:
    - cron: '53 * * * *'
  push:
    tags:
      - '2.0.0-alpha.*'
      - '2.0.0-beta.*'
      - '2.0.0-rc.*'
      - '2.0.0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to audit, for example 2.0.0-alpha.84'
        required: true

permissions:
  contents: read

jobs:
  docs-release-audit:
    name: Verify complete Waterline public release train
    if: >-
      ${{
        github.event_name != 'schedule' ||
        github.server_url == 'https://github.com' ||
        (github.server_url == '' &&
         (github.repository == '' ||
          github.repository == 'durable-workflow/waterline'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(node -e "process.stdout.write(require('./composer.json').extra['durable-workflow']['product-train'])")"
          fi
          tag="${tag#v}"
          if ! printf '%s\n' "$tag" | grep -Eq '^2\.0\.0((-(alpha|beta|rc)\.[0-9]+)?)$'; then
            echo "::error::Invalid Waterline release tag for docs audit: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release source as inert qualification data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: .release-source
          persist-credentials: false

      - name: Install Composer for exact-current qualification
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Require source-bound GitHub, Packagist, and image surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/verify-release-surfaces.py \
            --version "${{ steps.release.outputs.tag }}" \
            --attempts 20 \
            --sleep 30 \
            --evidence release-surfaces-evidence.json

      - name: Solve the exact Waterline, Workflow, and PHP SDK tuple
        env:
          EXACT_CURRENT_COMPOSER_MANIFEST: .release-source/composer.json
          EXACT_CURRENT_COMPOSER_EVIDENCE: exact-current-composer-evidence.json
        run: scripts/ci/check-exact-current-composer.sh

      - name: Wait for Packagist release
        env:
          PACKAGIST_PACKAGE_NAME: durable-workflow/waterline
          PACKAGIST_PACKAGE_VERSION: ${{ steps.release.outputs.tag }}
        run: scripts/ci/check-packagist-release.sh

      - name: Require live docs release audit refresh
        env:
          DOCS_RELEASE_AUDIT_ARTIFACT: waterline
          DOCS_RELEASE_AUDIT_VERSION: ${{ steps.release.outputs.tag }}
          DOCS_RELEASE_AUDIT_COMPOSER_MANIFEST: .release-source/composer.json
          DOCS_RELEASE_AUDIT_EVIDENCE: docs-release-audit-evidence.json
          DOCS_RELEASE_AUDIT_HANDOFF: docs-release-audit-handoff.json
        run: scripts/ci/check-docs-release-audit.sh

      - name: Upload docs release audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: docs-release-audit-evidence
          path: |
            docs-release-audit-evidence.json
            docs-release-audit-handoff.json
            exact-current-composer-evidence.json
            release-surfaces-evidence.json
          if-no-files-found: warn
