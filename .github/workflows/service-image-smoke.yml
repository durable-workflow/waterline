name: Service image smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact published Waterline image index digest
        required: true
        type: string
      release_version:
        description: Exact stable Waterline release tag
        required: true
        type: string
      source_commit:
        description: Exact commit of the published tag
        required: true
        type: string
      publisher_commit:
        description: Protected main publisher commit that signed the image's build provenance (required after 2.13.2)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  arm64-build:
    name: Build service image on native arm64
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - name: Compile the image on arm64 without registry credentials
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: false
      - name: Exercise the current stable public service image on arm64
        run: |
          EXPECTED_WATERLINE_VERSION="$(
            python3 -c 'import json, pathlib; value = json.loads(pathlib.Path("release/current-product-tuple.json").read_text()); print(value["versions"]["waterline"])'
          )"
          WATERLINE_IMAGE="durableworkflow/waterline:${EXPECTED_WATERLINE_VERSION}"
          export WATERLINE_IMAGE EXPECTED_WATERLINE_VERSION
          SERVICE_IMAGE_SKIP_BUILD=1 scripts/ci/service-mode-image-smoke.sh

  smoke:
    name: Self-contained service image smoke
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Exercise service mode through the PHP SDK
        run: scripts/ci/service-mode-image-smoke.sh
      - name: Exercise the current stable public service image
        run: |
          EXPECTED_WATERLINE_VERSION="$(
            python3 -c 'import json, pathlib; value = json.loads(pathlib.Path("release/current-product-tuple.json").read_text()); print(value["versions"]["waterline"])'
          )"
          WATERLINE_IMAGE="durableworkflow/waterline:${EXPECTED_WATERLINE_VERSION}"
          export WATERLINE_IMAGE EXPECTED_WATERLINE_VERSION
          SERVICE_IMAGE_SKIP_BUILD=1 scripts/ci/service-mode-image-smoke.sh

  runner-docker-config:
    name: Publisher runner Docker config isolation
    if: github.event_name != 'workflow_dispatch'
    # Same image as the protected publisher job.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Isolate and restore the runner's own Docker config
      shell: bash
      run: |
        set -euo pipefail
        config="$HOME/.docker/config.json"
        # Report shape only; contents are never printed.
        if [[ -e "$config" ]]; then
          echo "Runner ships $config with top-level keys: $(jq -c 'keys' "$config")"
          before="$(sha256sum "$config" | cut -d ' ' -f 1)"
        else
          echo "Runner has no $config."
          before=absent
        fi
        scripts/ci/publication-docker-config.sh isolate
        test ! -e "$config" || { echo "::error::$config still exists after isolation."; exit 1; }
        printf '%s\n' '{"auths":{"docker.io":{"auth":"cHJvYmU6cHJvYmU="}}}' > "$config"
        scripts/ci/publication-docker-config.sh restore
        if [[ "$before" = absent ]]; then
          test ! -e "$config" || { echo "::error::Restore left a publication config behind."; exit 1; }
        else
          test "$(sha256sum "$config" | cut -d ' ' -f 1)" = "$before" \
            || { echo "::error::Restore did not return the runner's original config."; exit 1; }
        fi
        echo "Isolation and restore returned the runner's Docker config unchanged."

  qualify-published:
    name: Qualify the selected published image
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/published-image-qualification.yml # local
    with:
      image_digest: ${{ inputs.image_digest }}
      release_version: ${{ inputs.release_version }}
      source_commit: ${{ inputs.source_commit }}
      publisher_commit: ${{ inputs.publisher_commit }}
