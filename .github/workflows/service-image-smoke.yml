name: Service image smoke

on:
  pull_request:
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  smoke:
    name: Self-contained service image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Exercise service mode through the PHP SDK
        run: scripts/ci/service-mode-image-smoke.sh
      - name: Exercise the resolver-selected public service image
        run: |
          tuple="$(mktemp)"
          trap 'rm -f "$tuple"' EXIT
          python3 scripts/resolve-current-prerelease.py json > "$tuple"
          WATERLINE_IMAGE="$(
            python3 -c 'import json, pathlib, sys; value = json.loads(pathlib.Path(sys.argv[1]).read_text()); print(value["service_image"]["pull"])' "$tuple"
          )"
          EXPECTED_WATERLINE_VERSION="$(
            python3 -c 'import json, pathlib, sys; value = json.loads(pathlib.Path(sys.argv[1]).read_text()); print(value["release"])' "$tuple"
          )"
          export WATERLINE_IMAGE EXPECTED_WATERLINE_VERSION
          SERVICE_IMAGE_SKIP_BUILD=1 scripts/ci/service-mode-image-smoke.sh
