name: Screenshots

on:
  workflow_dispatch:
    inputs:
      sample_app_ref:
        description: "sample-app branch/SHA to use"
        required: false
        default: "main"
      waterline_ref:
        description: "Waterline branch/SHA to screenshot"
        required: false
        default: "v2"
      workflow_ref:
        description: "durable-workflow/workflow branch/SHA to override into sample-app"
        required: false
        default: "v2"
      publish_readme_assets:
        description: "Commit refreshed docs/screenshots assets back to the v2 branch"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  screenshots:
    outputs:
      artifact-digest: ${{ steps.privileged-handoff.outputs.artifact-digest }}
      artifact-id: ${{ steps.privileged-handoff.outputs.artifact-id }}
      source-run-attempt: ${{ github.run_attempt }}
      source-run-id: ${{ github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_USER: laravel
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: sample
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10

    env:
      APP_URL: http://127.0.0.1:8000
      WATERLINE_SERVICE_VISUAL_URL: http://127.0.0.1:8001
      SCREENSHOT_DIR: sample-app/screenshots

    steps:
      - name: Checkout waterline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          path: waterline
          persist-credentials: false
          ref: ${{ github.event.inputs.waterline_ref || 'v2' }}

      - name: Checkout sample-app
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/sample-app
          path: sample-app
          persist-credentials: false
          ref: ${{ github.event.inputs.sample_app_ref || 'main' }}

      - name: Checkout workflow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/workflow
          path: workflow
          persist-credentials: false
          ref: ${{ github.event.inputs.workflow_ref || 'v2' }}

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, redis, bcmath
          coverage: none
          tools: composer:v2

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22"

      - name: Override sample-app package dependencies
        working-directory: sample-app
        run: |
          composer config repositories.waterline-local '{"type":"path","url":"../waterline","options":{"symlink":false}}'
          composer config repositories.workflow-local '{"type":"path","url":"../workflow","options":{"symlink":false}}'
          composer require --no-update \
            "durable-workflow/waterline:*@dev" \
            "durable-workflow/workflow:*@dev"

      - name: Install sample-app dependencies
        working-directory: sample-app
        env:
          COMPOSER_MEMORY_LIMIT: "-1"
        run: composer update --with-all-dependencies --no-progress --no-interaction --prefer-dist

      - name: Configure sample-app environment
        working-directory: sample-app
        run: |
          APP_KEY_VALUE="base64:$(openssl rand -base64 32)"
          cat > .env << ENVEOF
          APP_NAME=Laravel
          APP_ENV=local
          APP_KEY=${APP_KEY_VALUE}
          APP_DEBUG=true
          APP_URL=${APP_URL}
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=sample
          DB_USERNAME=laravel
          DB_PASSWORD=password
          SHARED_DB_HOST=127.0.0.1
          SHARED_DB_PORT=3306
          SHARED_DB_DATABASE=sample
          SHARED_DB_USERNAME=laravel
          SHARED_DB_PASSWORD=password
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          QUEUE_CONNECTION=redis
          CACHE_STORE=redis
          SESSION_DRIVER=redis
          ENVEOF
          php artisan config:clear

      - name: Migrate and seed demo user
        working-directory: sample-app
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Publish Waterline assets
        working-directory: sample-app
        run: |
          php artisan vendor:publish --tag=waterline-assets --force
          test -f public/vendor/waterline/app-dark.css || { echo "::error::waterline CSS was not published"; exit 1; }
          test -f public/vendor/waterline/app.js || { echo "::error::waterline JS was not published"; exit 1; }
          test -f public/vendor/waterline/mix-manifest.json || { echo "::error::waterline mix-manifest.json was not published"; exit 1; }

      - name: Start web server
        working-directory: sample-app
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > ../web.log 2>&1 &
          echo $! > ../web.pid
          APP_URL="${WATERLINE_SERVICE_VISUAL_URL}" \
            WATERLINE_BACKEND=service \
            WATERLINE_SERVER_ENDPOINT=http://127.0.0.1:1 \
            WATERLINE_SERVER_TOKEN=run-detail-visual-token \
            php artisan serve --host=127.0.0.1 --port=8001 > ../service-web.log 2>&1 &
          echo $! > ../service-web.pid
          for attempt in $(seq 1 30); do
            if curl -sf "${APP_URL}/up" > /dev/null \
              && curl -sf "${WATERLINE_SERVICE_VISUAL_URL}/up" > /dev/null; then
              echo "Embedded and service web servers are up"
              break
            fi
            echo "Waiting for web servers (${attempt}/30)"
            sleep 1
          done
          if ! curl -sf "${APP_URL}/up" > /dev/null \
            || ! curl -sf "${WATERLINE_SERVICE_VISUAL_URL}/up" > /dev/null; then
            echo "::error::One or more web servers failed to respond"
            cat ../web.log
            cat ../service-web.log
            exit 1
          fi
          CSS_STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "${APP_URL}/vendor/waterline/app-dark.css")
          if [ "$CSS_STATUS" != "200" ]; then
            echo "::error::Waterline CSS not reachable at /vendor/waterline/app-dark.css (HTTP ${CSS_STATUS})"
            exit 1
          fi

      - name: Start queue worker
        working-directory: sample-app
        run: |
          php artisan queue:work redis --queue=default,activity --tries=3 --timeout=60 > ../worker.log 2>&1 &
          echo $! > ../worker.pid
          sleep 2

      - name: Seed workflow screenshot data
        working-directory: sample-app
        env:
          SCREENSHOT_RUN_ID: ${{ github.run_id }}
        run: |
          cat > screenshot-seed.php <<'PHP'
          <?php

          declare(strict_types=1);

          use App\Models\User;
          use App\Workflows\Elapsed\ElapsedTimeWorkflow;
          use App\Workflows\Simple\SimpleWorkflow;
          use App\Workflows\Webhooks\WebhookWorkflow;
          use Illuminate\Contracts\Console\Kernel;
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Hash;
          use Illuminate\Support\Str;
          use Workflow\V2\Enums\DuplicateStartPolicy;
          use Workflow\V2\Enums\ScheduleOverlapPolicy;
          use Workflow\V2\Models\WorkflowInstance;
          use Workflow\V2\Models\WorkflowRun;
          use Workflow\V2\Models\WorkflowRunSummary;
          use Workflow\V2\StartOptions;
          use Workflow\V2\Support\RunSummarySortKey;
          use Workflow\V2\Support\ScheduleManager;
          use Workflow\V2\WorkflowStub;

          require __DIR__ . '/vendor/autoload.php';

          $app = require __DIR__ . '/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();

          $runStamp = getenv('SCREENSHOT_RUN_ID') ?: date('YmdHis');

          User::query()->updateOrCreate(
              ['email' => 'demo@example.com'],
              [
                  'name' => 'Waterline Demo Operator',
                  'password' => Hash::make('password'),
              ],
          );

          function startWorkflow(string $workflowClass, string $instanceId, array $arguments, array $labels, array $memo = []): void
          {
              $options = new StartOptions(
                  duplicateStartPolicy: DuplicateStartPolicy::ReturnExistingActive,
                  businessKey: $labels['business'] ?? $instanceId,
                  labels: $labels,
                  memo: $memo,
                  searchAttributes: [
                      'demo_run' => 'waterline-screenshots',
                      'priority' => $labels['priority'] ?? 'normal',
                  ],
              );

              $stub = WorkflowStub::make($workflowClass, $instanceId);
              $stub->start(...array_merge($arguments, [$options]));
              $stub->refresh();

              echo "started {$instanceId} status={$stub->status()} run={$stub->runId()}\n";
          }

          for ($i = 1; $i <= 8; $i++) {
              startWorkflow(
                  SimpleWorkflow::class,
                  sprintf('demo-%s-simple-%02d', $runStamp, $i),
                  [],
                  [
                      'business' => sprintf('Invoice closeout %02d', $i),
                      'team' => $i % 2 === 0 ? 'billing' : 'fulfillment',
                      'priority' => $i % 3 === 0 ? 'high' : 'normal',
                      'kind' => 'simple',
                  ],
                  ['customer' => sprintf('Customer %02d', $i), 'source' => 'screenshots'],
              );
          }

          for ($i = 1; $i <= 2; $i++) {
              startWorkflow(
                  ElapsedTimeWorkflow::class,
                  sprintf('demo-%s-elapsed-%02d', $runStamp, $i),
                  [],
                  [
                      'business' => sprintf('Timed SLA check %02d', $i),
                      'team' => 'ops',
                      'priority' => 'normal',
                      'kind' => 'elapsed',
                  ],
                  ['sla' => 'three-second durable timer demo'],
              );
          }

          for ($i = 1; $i <= 2; $i++) {
              startWorkflow(
                  WebhookWorkflow::class,
                  sprintf('demo-%s-failed-webhook-%02d', $runStamp, $i),
                  [],
                  [
                      'business' => sprintf('Broken webhook intake %02d', $i),
                      'team' => 'integrations',
                      'priority' => 'urgent',
                      'kind' => 'expected-failure',
                  ],
                  ['expected_failure' => 'missing required webhook message argument'],
              );
          }

          for ($i = 1; $i <= 2; $i++) {
              startWorkflow(
                  WebhookWorkflow::class,
                  sprintf('demo-%s-waiting-webhook-%02d', $runStamp, $i),
                  [sprintf('Approval package %02d is ready for operator signal', $i)],
                  [
                      'business' => sprintf('Pending approval package %02d', $i),
                      'team' => 'approvals',
                      'priority' => 'high',
                      'kind' => 'waiting-signal',
                  ],
                  ['waiting_for' => 'ready signal'],
              );
          }

          function createTerminalWorkflowListRow(string $status, string $runStamp, int $offsetMinutes): void
          {
              $startedAt = now()->subMinutes($offsetMinutes + 5);
              $closedAt = now()->subMinutes($offsetMinutes);
              $instanceId = sprintf('demo-%s-%s', $runStamp, $status);
              $runId = (string) Str::ulid();

              $instance = WorkflowInstance::query()->create([
                  'id' => $instanceId,
                  'workflow_class' => SimpleWorkflow::class,
                  'workflow_type' => 'workflow.demo.simple',
                  'business_key' => sprintf('%s workflow example', ucfirst($status)),
                  'run_count' => 1,
              ]);

              $run = WorkflowRun::query()->create([
                  'id' => $runId,
                  'workflow_instance_id' => $instance->id,
                  'run_number' => 1,
                  'workflow_class' => SimpleWorkflow::class,
                  'workflow_type' => 'workflow.demo.simple',
                  'business_key' => $instance->business_key,
                  'status' => $status,
                  'closed_reason' => $status,
                  'started_at' => $startedAt,
                  'closed_at' => $closedAt,
                  'last_progress_at' => $closedAt,
                  'created_at' => $startedAt,
                  'updated_at' => $closedAt,
              ]);

              $instance->update(['current_run_id' => $run->id]);

              WorkflowRunSummary::query()->create([
                  'id' => $run->id,
                  'workflow_instance_id' => $instance->id,
                  'run_number' => 1,
                  'is_current_run' => true,
                  'engine_source' => 'v2',
                  'class' => SimpleWorkflow::class,
                  'workflow_type' => 'workflow.demo.simple',
                  'business_key' => $instance->business_key,
                  'status' => $status,
                  'status_bucket' => 'failed',
                  'closed_reason' => $status,
                  'started_at' => $startedAt,
                  'closed_at' => $closedAt,
                  'duration_ms' => $closedAt->diffInMilliseconds($startedAt),
                  'sort_timestamp' => $startedAt,
                  'sort_key' => RunSummarySortKey::key($startedAt, $startedAt, $closedAt, $run->id),
                  'created_at' => $startedAt,
                  'updated_at' => $closedAt,
              ]);

              echo "created {$status} list row run={$run->id}\n";
          }

          createTerminalWorkflowListRow('cancelled', $runStamp, 2);
          createTerminalWorkflowListRow('terminated', $runStamp, 1);

          ScheduleManager::create(
              scheduleId: 'daily-waterline-demo-closeout',
              workflowClass: SimpleWorkflow::class,
              cronExpression: '15 9 * * 1-5',
              timezone: 'UTC',
              overlapPolicy: ScheduleOverlapPolicy::Skip,
              labels: ['team' => 'billing', 'priority' => 'normal', 'kind' => 'scheduled'],
              memo: ['description' => 'Weekday billing closeout demo schedule'],
              searchAttributes: ['demo_run' => 'waterline-screenshots'],
              notes: 'Demo schedule created for Waterline screenshots',
          );

          ScheduleManager::create(
              scheduleId: 'hourly-waterline-sla-check',
              workflowClass: ElapsedTimeWorkflow::class,
              cronExpression: '0 * * * *',
              timezone: 'UTC',
              overlapPolicy: ScheduleOverlapPolicy::BufferOne,
              labels: ['team' => 'ops', 'priority' => 'high', 'kind' => 'scheduled'],
              memo: ['description' => 'Hourly durable SLA timer check'],
              searchAttributes: ['demo_run' => 'waterline-screenshots'],
              notes: 'Demo schedule with buffering for Waterline screenshots',
          );

          function summaryCounts(): array
          {
              return WorkflowRunSummary::query()
                  ->select('status', DB::raw('count(*) as total'))
                  ->groupBy('status')
                  ->orderBy('status')
                  ->pluck('total', 'status')
                  ->all();
          }

          sleep(20);
          $summaryCounts = summaryCounts();
          $completed = (int) ($summaryCounts['completed'] ?? 0);

          if ($completed < 5) {
              passthru(PHP_BINARY . ' artisan workflow:v2:repair-pass --limit=50', $exitCode);
              sleep(12);
              $summaryCounts = summaryCounts();
          }

          $completed = (int) ($summaryCounts['completed'] ?? 0);
          $failed = (int) ($summaryCounts['failed'] ?? 0);
          $cancelled = (int) ($summaryCounts['cancelled'] ?? 0);
          $terminated = (int) ($summaryCounts['terminated'] ?? 0);
          $runningBucket = WorkflowRunSummary::query()->where('status_bucket', 'running')->count();
          $historyEvents = DB::table('workflow_history_events')->count();
          $activities = DB::table('activity_executions')->count();
          $schedules = DB::table('workflow_schedules')->whereIn('status', ['active', 'paused'])->count();

          echo 'summary_counts=' . json_encode($summaryCounts, JSON_THROW_ON_ERROR) . "\n";
          echo "running_bucket={$runningBucket}\n";
          echo "history_events={$historyEvents}\n";
          echo "activity_executions={$activities}\n";
          echo "schedules={$schedules}\n";

          if ($completed < 5) {
              throw new RuntimeException("Expected at least 5 completed workflow runs, found {$completed}.");
          }

          if ($failed < 1) {
              throw new RuntimeException("Expected at least 1 failed workflow run, found {$failed}.");
          }

          if ($cancelled < 1) {
              throw new RuntimeException("Expected at least 1 cancelled workflow run, found {$cancelled}.");
          }

          if ($terminated < 1) {
              throw new RuntimeException("Expected at least 1 terminated workflow run, found {$terminated}.");
          }

          if ($runningBucket < 1) {
              throw new RuntimeException("Expected at least 1 running/waiting workflow run, found {$runningBucket}.");
          }

          if ($historyEvents < 10 || $activities < 5) {
              throw new RuntimeException('Expected non-empty workflow history and activity execution data.');
          }

          if ($schedules < 2) {
              throw new RuntimeException("Expected at least 2 demo schedules, found {$schedules}.");
          }

          echo "seed complete\n";
          PHP

          php screenshot-seed.php

      - name: Install Playwright
        working-directory: sample-app
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Capture screenshots
        working-directory: sample-app
        env:
          OUTPUT_DIR: screenshots
        run: |
          cat > waterline-screenshots.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import path from 'path';

          const BASE = process.env.APP_URL || 'http://127.0.0.1:8000';
          const OUTPUT = process.env.OUTPUT_DIR || 'screenshots';
          fs.mkdirSync(OUTPUT, { recursive: true });

          const pages = [
            { name: 'dashboard.png', url: '/waterline' },
            { name: 'running.png', url: '/waterline/running', workflowList: 'running' },
            { name: 'completed.png', url: '/waterline/completed', workflowList: 'completed' },
            { name: 'failed.png', url: '/waterline/failed', workflowList: 'failed' },
            { name: 'cancelled.png', url: '/waterline/cancelled', workflowList: 'cancelled' },
            { name: 'terminated.png', url: '/waterline/terminated', workflowList: 'terminated' },
            { name: 'workers.png', url: '/waterline/workers' },
            { name: 'schedules.png', url: '/waterline/schedules' },
          ];

          async function forcePublishedStylesheet(page) {
            await page.evaluate(() => {
              const link = document.getElementById('app-stylesheet');
              if (!link) {
                return;
              }

              const expected = new URL('/vendor/waterline/app-dark.css', window.location.origin).href;
              if (link.href !== expected) {
                link.href = expected;
              }
            }).catch(() => {});
          }

          async function stabilizeLayout(page) {
            await page.evaluate(() => {
              let style = document.getElementById('screenshot-layout-guard');
              if (!style) {
                style = document.createElement('style');
                style.id = 'screenshot-layout-guard';
                style.textContent = `
                  html, body { max-width: 100% !important; overflow-x: hidden !important; }
                  .apexcharts-canvas,
                  .apexcharts-svg,
                  .apexcharts-inner,
                  .apexcharts-legend {
                    max-width: 100% !important;
                  }
                  .apexcharts-canvas,
                  .apexcharts-canvas svg {
                    width: 100% !important;
                  }
                `;
                document.head.appendChild(style);
              }

              window.dispatchEvent(new Event('resize'));
            }).catch(() => {});
            await page.waitForTimeout(500);
          }

          async function waitForWaterline(page) {
            await forcePublishedStylesheet(page);
            await stabilizeLayout(page);
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            await forcePublishedStylesheet(page);
            await stabilizeLayout(page);
            await page.waitForFunction(() => {
              const logo = document.querySelector('svg.logo');
              const sidebarIcon = document.querySelector('.sidebar svg');

              if (!logo || !sidebarIcon) {
                return false;
              }

              return parseFloat(getComputedStyle(logo).width) < 80
                && parseFloat(getComputedStyle(sidebarIcon).width) < 40
                && getComputedStyle(document.body).fontFamily !== '"Times New Roman"';
            }, { timeout: 10000 }).catch(() => {});
            await page.waitForTimeout(4000);
            await stabilizeLayout(page);
          }

          async function maybeLogin(page) {
            await page.goto(`${BASE}/waterline`, { waitUntil: 'networkidle', timeout: 30000 });
            await waitForWaterline(page);

            if (!/\/login(?:$|\?)/.test(page.url())) {
              return;
            }

            await page.fill('input[name=email]', 'demo@example.com');
            await page.fill('input[name=password]', 'password');
            await Promise.all([
              page.waitForNavigation({ waitUntil: 'networkidle', timeout: 30000 }).catch(() => {}),
              page.click('button[type=submit], input[type=submit]'),
            ]);
          }

          async function installApiGuards(page) {
            await page.route('**/waterline/api/instances/**', async route => {
              const response = await route.fetch();
              const contentType = response.headers()['content-type'] || '';

              if (!contentType.includes('application/json')) {
                await route.fulfill({ response });
                return;
              }

              const json = await response.json();
              const activities = Array.isArray(json.activities) ? json.activities : [];

              for (const activity of activities) {
                activity.last_heartbeat_at = activity.last_heartbeat_at
                  || activity.closed_at
                  || activity.started_at
                  || json.closed_at
                  || json.updated_at
                  || json.created_at;

                for (const attempt of activity.attempts || []) {
                  attempt.last_heartbeat_at = attempt.last_heartbeat_at
                    || attempt.closed_at
                    || attempt.started_at
                    || activity.last_heartbeat_at;
                }
              }

              await route.fulfill({ response, json });
            });
          }

          async function assertWorkflowList(page, type) {
            const lodashType = await page.evaluate(() => typeof window._);

            if (lodashType !== 'undefined') {
              throw new Error(`Unexpected Lodash global on the ${type} workflow list`);
            }

            const rows = page.locator('tbody tr.flow-row');
            await rows.first().waitFor({ state: 'visible', timeout: 15000 });

            const rowCount = await rows.count();
            if (rowCount < 1) {
              throw new Error(`Expected a returned row on the ${type} workflow list`);
            }

            console.log(`WORKFLOW_LIST ${type} ROWS ${rowCount} LODASH ${lodashType}`);
          }

          async function verifyWorkflowListRefresh(page) {
            await page.goto(`${BASE}/waterline/running`, { waitUntil: 'networkidle', timeout: 30000 });
            await waitForWaterline(page);
            await assertWorkflowList(page, 'running-refresh');

            const firstRowLink = page.locator('tbody tr.flow-row a').first();
            const firstRowHref = await firstRowLink.getAttribute('href');
            const firstRunId = firstRowHref ? firstRowHref.split('/').pop() : null;
            const autoRefreshButton = page.getByTitle('Auto refresh entries', { exact: true });
            const requestPattern = '**/waterline/api/flows/running?**';

            if (!firstRunId) {
              throw new Error('Cannot identify the current first workflow row');
            }

            async function setAutoRefresh(enabled) {
              const active = await autoRefreshButton.evaluate(element => element.classList.contains('is-active'));

              if (active !== enabled) {
                await autoRefreshButton.click();
              }

              await page.waitForFunction((expected) => {
                const button = document.querySelector('[title="Auto refresh entries"]');

                return button && button.classList.contains('is-active') === expected;
              }, enabled);
            }

            async function runHeldRefresh(transformResponse) {
              let releaseResponse;
              let requestStartedResolve;
              let requestStartedReject;

              const responseRelease = new Promise(resolve => {
                releaseResponse = resolve;
              });
              const requestStarted = new Promise((resolve, reject) => {
                requestStartedResolve = resolve;
                requestStartedReject = reject;
              });
              const holdRefreshResponse = async route => {
                try {
                  const response = await route.fetch();
                  const json = await response.json();
                  const rows = Array.isArray(json.data) ? json.data : [];
                  const currentIndex = rows.findIndex(row => (row.run_id || row.id) === firstRunId);

                  if (currentIndex === -1) {
                    throw new Error('The current first workflow row left the running collection');
                  }

                  const [currentFirst] = rows.splice(currentIndex, 1);
                  json.data = transformResponse(currentFirst, rows);
                  requestStartedResolve();
                  await responseRelease;
                  await route.fulfill({ response, json });
                } catch (error) {
                  requestStartedReject(error);
                  throw error;
                }
              };

              await page.route(requestPattern, holdRefreshResponse);

              try {
                await setAutoRefresh(true);
                await Promise.race([
                  requestStarted,
                  new Promise((resolve, reject) => {
                    setTimeout(() => reject(new Error('Timed out waiting for an auto-refresh request')), 10000);
                  }),
                ]);
                await setAutoRefresh(false);

                const refreshResponse = page.waitForResponse(response => (
                  response.url().includes('/waterline/api/flows/running?')
                  && response.request().method() === 'GET'
                ));

                releaseResponse();
                await refreshResponse;
                await page.waitForTimeout(500);
              } finally {
                releaseResponse();
                await page.unroute(requestPattern, holdRefreshResponse);
              }
            }

            await setAutoRefresh(false);
            await runHeldRefresh((currentFirst, rows) => [currentFirst, ...rows]);

            if (await page.getByText('New runs are waiting.', { exact: true }).count()) {
              throw new Error('An unchanged first workflow row was detected as new');
            }

            const syntheticRunId = '01JSCREENSHOTNEWENTRY00001';
            await runHeldRefresh((currentFirst, rows) => [
              {
                ...currentFirst,
                id: syntheticRunId,
                run_id: syntheticRunId,
                sort_key: `${currentFirst.sort_key || currentFirst.id}:new`,
              },
              currentFirst,
              ...rows,
            ]);

            await page.getByText('New runs are waiting.', { exact: true }).waitFor({
              state: 'visible',
              timeout: 10000,
            });

            if (await firstRowLink.getAttribute('href') !== firstRowHref) {
              throw new Error('New-entry detection replaced the current first workflow row');
            }

            console.log('WORKFLOW_LIST_REFRESH stable=same changed=detected');
          }

          async function capture(page, name, url, workflowList = null) {
            await page.goto(`${BASE}${url}`, { waitUntil: 'networkidle', timeout: 30000 });
            await waitForWaterline(page);

            if (workflowList) {
              await assertWorkflowList(page, workflowList);
            }

            await page.screenshot({ path: path.join(OUTPUT, name), fullPage: true });
            console.log(`${name} ${page.url()}`);
          }

          const browser = await chromium.launch({ args: ['--no-sandbox'] });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1,
          });

          const page = await context.newPage();
          await installApiGuards(page);
          const pageErrors = [];

          page.on('pageerror', error => {
            pageErrors.push({
              message: error.message,
              url: page.url(),
            });
            console.log(`PAGEERROR ${error.message.slice(0, 300)}`);
          });

          page.on('requestfailed', request => {
            console.log(`REQUESTFAILED ${request.url()} ${request.failure()?.errorText || ''}`.slice(0, 500));
          });

          try {
            await maybeLogin(page);

            for (const item of pages) {
              await capture(page, item.name, item.url, item.workflowList);
            }

            await verifyWorkflowListRefresh(page);

            await page.goto(`${BASE}/waterline/completed`, { waitUntil: 'networkidle', timeout: 30000 });
            await waitForWaterline(page);

            const rowLink = page.locator('tbody tr a[href*="/flows/instances/"], tbody tr a').first();
            const href = await rowLink.count() ? await rowLink.getAttribute('href') : null;
            if (href) {
              await rowLink.click();
              await waitForWaterline(page);

              if (!page.url().includes('/flows/instances/')) {
                await page.goto(new URL(href, BASE).href, { waitUntil: 'networkidle', timeout: 30000 });
                await waitForWaterline(page);
              }

              await page.waitForSelector('text=Timeline, text=Activities, text=State Details', { timeout: 15000 }).catch(() => {});
            }

            await page.screenshot({ path: path.join(OUTPUT, 'workflow-detail.png'), fullPage: true });
            console.log(`workflow-detail.png ${page.url()}`);
          } finally {
            await browser.close();
          }

          const expected = [
            'dashboard.png',
            'running.png',
            'completed.png',
            'failed.png',
            'cancelled.png',
            'terminated.png',
            'workflow-detail.png',
            'workers.png',
            'schedules.png',
          ];

          let failed = pageErrors.length > 0;

          for (const error of pageErrors) {
            console.log(`UNCAUGHT_PAGE_ERROR ${error.url} ${error.message}`.slice(0, 1000));
          }

          for (const file of expected) {
            const fullPath = path.join(OUTPUT, file);
            if (!fs.existsSync(fullPath)) {
              console.log(`MISSING ${file}`);
              failed = true;
              continue;
            }

            const size = fs.statSync(fullPath).size;
            console.log(`SIZE ${file} ${size}`);

            if (size < 10 * 1024) {
              console.log(`TOO_SMALL ${file}`);
              failed = true;
            }

            if (size > 500 * 1024) {
              console.log(`WARN large screenshot ${file} ${size}`);
            }
          }

          if (failed) {
            process.exit(1);
          }
          NODE

