      - name: Qualify responsive workflow-list dialogs
        working-directory: sample-app
        env:
          OUTPUT_DIR: dialog-evidence
        run: >-
          node ../waterline/scripts/ci/workflow-list-dialog-visual.mjs
          --base-url "${APP_URL}"
          --output-dir "${OUTPUT_DIR}"

      - name: Upload responsive dialog evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: waterline-dialog-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: sample-app/dialog-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Qualify responsive run detail
        working-directory: sample-app
        env:
          OUTPUT_DIR: run-detail-evidence
        run: >-
          node ../waterline/scripts/ci/run-detail-visual.mjs
          --base-url "${APP_URL}"
          --service-base-url "${WATERLINE_SERVICE_VISUAL_URL}"
          --output-dir "${OUTPUT_DIR}"

      - name: Upload responsive run-detail evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: waterline-run-detail-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: sample-app/run-detail-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload screenshots
        id: upload_screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: waterline-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: sample-app/screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Add screenshot summary
        if: always()
        run: |
          {
            echo "## Waterline screenshots"
            echo
            echo "The full PNG set is uploaded as the run-attempt-bound screenshot artifact."
            echo
            if [ -d "${SCREENSHOT_DIR}" ]; then
              find "${SCREENSHOT_DIR}" -maxdepth 1 -type f -name "*.png" -printf "- %f (%s bytes)\n" | sort
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics on failure
        if: failure()
        working-directory: sample-app
        run: |
          mkdir -p ../diagnostics
          cp ../web.log ../diagnostics/ 2>/dev/null || true
          cp ../service-web.log ../diagnostics/ 2>/dev/null || true
          cp ../worker.log ../diagnostics/ 2>/dev/null || true
          cp storage/logs/laravel.log ../diagnostics/ 2>/dev/null || true
          php artisan about > ../diagnostics/about.txt 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: screenshots-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          [ -f web.pid ] && kill "$(cat web.pid)" 2>/dev/null || true
          [ -f service-web.pid ] && kill "$(cat service-web.pid)" 2>/dev/null || true
          [ -f worker.pid ] && kill "$(cat worker.pid)" 2>/dev/null || true

      - name: Package the privileged screenshot handoff as one immutable file
        run: tar -cf screenshot-handoff.tar -C sample-app/screenshots .

      - name: Bind the privileged screenshot handoff identity and digest
        id: privileged-handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          archive: false
          if-no-files-found: error
          path: screenshot-handoff.tar

  publish:
    name: Publish protected screenshot assets
    needs: screenshots
    if: >-
      github.ref == 'refs/heads/v2' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.publish_readme_assets != false &&
        (inputs.waterline_ref == '' || inputs.waterline_ref == 'v2') &&
        (inputs.sample_app_ref == '' || inputs.sample_app_ref == 'main') &&
        (inputs.workflow_ref == '' || inputs.workflow_ref == 'v2')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the protected Waterline branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restore the exact generated screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.screenshots.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-screenshot-handoff
          repository: ${{ github.repository }}
          run-id: ${{ needs.screenshots.outputs.source-run-id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-screenshot-handoff
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.screenshots.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.screenshots.outputs.artifact-id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.screenshots.outputs.source-run-attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.screenshots.outputs.source-run-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - name: Configure protected screenshot publication credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          clean: false
          fetch-depth: 0
          ref: v2

      - name: Extract the validated screenshot handoff
        run: |
          mkdir published-screenshots
          tar -xf isolated-screenshot-handoff/screenshot-handoff.tar -C published-screenshots

      - name: Validate and publish inert PNG assets
        run: |
          set -euo pipefail
          expected=(
            dashboard.png
            running.png
            completed.png
            failed.png
            cancelled.png
            terminated.png
            workflow-detail.png
            workers.png
            schedules.png
          )
          mapfile -d '' entries < <(
            find published-screenshots -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne "${#expected[@]}" ]; then
            printf 'screenshot artifact must contain exactly %s files\n' "${#expected[@]}" >&2
            exit 1
          fi
          for name in "${expected[@]}"; do
            source="published-screenshots/$name"
            if [ ! -f "$source" ] || [ -L "$source" ]; then
              printf 'missing or unsafe screenshot asset: %s\n' "$name" >&2
              exit 1
            fi
            signature="$(od -An -tx1 -N8 "$source" | tr -d ' \n')"
            size="$(stat -c '%s' "$source")"
            if [ "$signature" != 89504e470d0a1a0a ] || [ "$size" -lt 10240 ] || [ "$size" -gt 2097152 ]; then
              printf 'invalid PNG screenshot asset: %s\n' "$name" >&2
              exit 1
            fi
          done

          mkdir -p docs/screenshots
          for name in "${expected[@]}"; do
            cp "published-screenshots/$name" "docs/screenshots/$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot asset changes to publish."
          else
            git commit -m "Update Waterline screenshots"
            git pull --rebase origin v2
            git push origin HEAD:v2
          fi
