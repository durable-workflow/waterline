name: Published service catalog inspection

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Immutable published durableworkflow/server digest
        required: true
      server_version:
        description: Exact published Server version
        required: true
      waterline_image:
        description: Immutable published durableworkflow/waterline digest
        required: true
      waterline_version:
        description: Exact published Waterline version
        required: true
      server_harness_commit:
        description: Exact public Server commit containing the published Nexus producer
        required: true
      workflow_version:
        description: Exact published Workflow PHP version
        required: true
      php_caller_version:
        description: Exact published PHP SDK caller/service version
        required: true
      python_caller_version:
        description: Exact published Python SDK caller/service version
        required: true
      cli_version:
        description: Exact published CLI version
        required: true

permissions:
  contents: read

concurrency:
  group: published-service-catalog
  cancel-in-progress: false

jobs:
  inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DW_SERVER_IMAGE: ${{ inputs.server_image }}
      DW_SERVER_VERSION: ${{ inputs.server_version }}
      DW_WATERLINE_VERSION: ${{ inputs.waterline_version }}
      DW_NEXUS_WATERLINE_IMAGE: ${{ inputs.waterline_image }}
      DW_WORKFLOW_PHP_VERSION: ${{ inputs.workflow_version }}
      DW_PHP_SDK_VERSION: ${{ inputs.php_caller_version }}
      DW_PYTHON_SDK_VERSION: ${{ inputs.python_caller_version }}
      DW_CLI_VERSION: ${{ inputs.cli_version }}
      DW_NEXUS_WATERLINE_INSPECTOR: ${{ github.workspace }}/waterline/scripts/ci/service-catalog-cli-published.mjs
    steps:
      - name: Set paths for this execution
        run: |
          printf '%s\n' \
            "DW_NEXUS_RESULT_DIR=$RUNNER_TEMP/catalog-proof" \
            "DW_NEXUS_RUN_ROOT=$RUNNER_TEMP/catalog-run" \
            "DW_NEXUS_WATERLINE_PLAYWRIGHT_ROOT=$RUNNER_TEMP/catalog-browser" \
            "DW_NEXUS_CLI_BINARY=$RUNNER_TEMP/catalog-cli/dw-linux-x86_64" \
            "DW_NEXUS_CLI_HOME=$RUNNER_TEMP/catalog-cli-home" >> "$GITHUB_ENV"
      - name: Validate immutable artifact and harness inputs
        env:
          HARNESS_COMMIT: ${{ inputs.server_harness_commit }}
        run: |
          set -euo pipefail
          [[ "$DW_SERVER_IMAGE" =~ ^durableworkflow/server@sha256:[0-9a-f]{64}$ ]]
          [[ "$DW_NEXUS_WATERLINE_IMAGE" =~ ^durableworkflow/waterline@sha256:[0-9a-f]{64}$ ]]
          [[ "$HARNESS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          for name in DW_SERVER_VERSION DW_WATERLINE_VERSION DW_WORKFLOW_PHP_VERSION DW_PHP_SDK_VERSION DW_CLI_VERSION; do
            [[ "${!name}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          done
          [[ "$DW_PYTHON_SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]
      - name: Check out the observer harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: waterline
          persist-credentials: false
      - name: Check out the exact published Nexus producer harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: durable-workflow/server
          ref: ${{ inputs.server_harness_commit }}
          path: server
          persist-credentials: false
      - name: Check out the unchanged bounded report exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: durable-workflow/server
          ref: 964f9e3d5b713376757294fd38c2cb3b4cba1400
          path: server-summary
          sparse-checkout: scripts/conformance/server-parity/artifact-summary.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install isolated browser tooling
        run: |
          mkdir -p "$RUNNER_TEMP/catalog-browser"
          cd "$RUNNER_TEMP/catalog-browser"
          npm init -y
          npm install --save-exact playwright@1.63.0
          npx playwright install chromium --with-deps
      - name: Check constructed evidence refusals
        working-directory: server
        run: |
          node --test tests/Unit/NexusSdkCallerEvidenceTest.mjs
          node --test "$GITHUB_WORKSPACE/waterline/tests/Frontend/service-catalog-cli-published.test.mjs"
      - name: Install the exact checksum-verified published CLI
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/catalog-cli"
          mkdir -p "$cli_root"
          base="https://github.com/durable-workflow/cli/releases/download/$DW_CLI_VERSION"
          curl --fail --silent --location --max-time 120 "$base/SHA256SUMS" -o "$cli_root/SHA256SUMS"
          curl --fail --silent --location --max-time 120 "$base/dw-linux-x86_64" -o "$DW_NEXUS_CLI_BINARY"
          cd "$cli_root"
          awk '$2 == "dw-linux-x86_64" {print}' SHA256SUMS > selected-sha256.txt
          test "$(wc -l < selected-sha256.txt)" -eq 1
          sha256sum --check selected-sha256.txt
          chmod 0755 "$DW_NEXUS_CLI_BINARY"
      - name: Execute original published calls and record the broader platform outcome
        working-directory: server
        run: |
          set -euo pipefail
          mkdir -p "$DW_NEXUS_RESULT_DIR"
          set +e
          scripts/conformance/nexus-published-artifacts.sh > "$DW_NEXUS_RESULT_DIR/producer.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$DW_NEXUS_RESULT_DIR/full-platform-status.txt"
          # Broader platform coverage remains separate from the strict Nexus
          # and real-browser assertions below; its outcome is always retained.
          exit 0
      - name: Require the original strict Nexus assertions
        working-directory: server
        env:
          NEXUS_SDK_CLIENT_MATRIX: ${{ runner.temp }}/catalog-proof/nexus-sdk-client-matrix.json
          NEXUS_CONFORMANCE_RESULT: ${{ runner.temp }}/catalog-proof/nexus-conformance-result.json
          NEXUS_PYTHON_WORKFLOW_PROBE: ${{ runner.temp }}/catalog-proof/nexus-python-workflow-probe.json
          NEXUS_PHP_WORKFLOW_PROBE: ${{ runner.temp }}/catalog-proof/nexus-php-workflow-probe.json
          NEXUS_PHP_PHP_WORKFLOW_PROBE: ${{ runner.temp }}/catalog-proof/nexus-php-php-workflow-probe.json
          NEXUS_PYTHON_PYTHON_WORKFLOW_PROBE: ${{ runner.temp }}/catalog-proof/nexus-python-python-workflow-probe.json
          NEXUS_TYPED_FAILURE_PROBES: ${{ runner.temp }}/catalog-proof/nexus-typed-failure-probes.json
          NEXUS_CANCELLATION_PROBES: ${{ runner.temp }}/catalog-proof/nexus-cancellation-probes.json
          NEXUS_WAITING_CALLER_CANCELLATION_PROBES: ${{ runner.temp }}/catalog-proof/nexus-waiting-caller-cancellation-probes.json
          NEXUS_CALLER_RECOVERY_PROBES: ${{ runner.temp }}/catalog-proof/nexus-caller-recovery-probes.json
          NEXUS_BACKEND_INTERRUPTION_PROBES: ${{ runner.temp }}/catalog-proof/nexus-backend-interruption-probes.json
          NEXUS_DEADLINE_PROBE: ${{ runner.temp }}/catalog-proof/nexus-deadline-probe.json
        run: |
          set +e
          node --test tests/Unit/NexusSdkCallerEvidenceTest.mjs > "$DW_NEXUS_RESULT_DIR/nexus-assertions.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$DW_NEXUS_RESULT_DIR/nexus-assertions-status.txt"
          tail -n 60 "$DW_NEXUS_RESULT_DIR/nexus-assertions.log"
          exit "$status"
      - name: Require real API, browser and CLI inspection of all original calls
        working-directory: server
        run: |
          node - "$DW_NEXUS_RESULT_DIR/waterline-catalog/report.json" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.classification, 'published_api_browser');
          assert.equal(report.outcome, 'pass');
          assert.equal(report.original_calls, 24);
          assert.equal(report.cases.length, 72);
          assert.equal(report.cases.filter(row => row.screenshot).length, 36);
          assert.deepEqual(report.mutations, []);
          assert.deepEqual(report.page_errors, []);
          const cli = JSON.parse(fs.readFileSync(`${process.env.DW_NEXUS_RESULT_DIR}/waterline-catalog/cli-report.json`, 'utf8'));
          assert.equal(cli.classification, 'published_cli');
          assert.equal(cli.outcome, 'pass');
          assert.equal(cli.version, process.env.DW_CLI_VERSION);
          assert.equal(cli.original_calls, 24);
          assert.equal(cli.cases.length, 24);
          assert.equal(cli.cases.filter(row => row.wrong_selector_refused).length, 24);
          assert.equal(cli.history_mutations, 0);
          NODE
      - name: Export bounded results and failure tails
        if: always()
        env:
          INSPECTION_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalog-summary-input"
          node --input-type=module <<'NODE'
          import {existsSync, readFileSync, writeFileSync} from 'node:fs';
          const root = process.env.DW_NEXUS_RESULT_DIR;
          const read = name => {
            const path = `${root}/${name}`;
            if (!existsSync(path)) return null;
            try { return JSON.parse(readFileSync(path, 'utf8')); }
            catch { return {decode_error: true}; }
          };
          const platform = read('nexus-conformance-result.json');
          const browser = read('waterline-catalog/report.json');
          const cli = read('waterline-catalog/cli-report.json');
          const report = {
            outcome: process.env.INSPECTION_OUTCOME,
            artifacts: Object.fromEntries(Object.entries(process.env).filter(([key]) => /^DW_(?:SERVER_IMAGE|SERVER_VERSION|WORKFLOW_PHP_VERSION|PHP_SDK_VERSION|PYTHON_SDK_VERSION|CLI_VERSION|WATERLINE_VERSION|NEXUS_WATERLINE_IMAGE)$/.test(key))),
            full_platform_exit: read('full-platform-status.txt'),
            nexus_assertions_exit: read('nexus-assertions-status.txt'),
            platform_outcome: platform?.outcome ?? null,
            scenarios: Object.fromEntries(Object.entries(platform?.scenario_results ?? {}).map(([name, row]) => [row.scenario_id ?? name, {
              status: row.status, classification: row.classification, findings: row.linked_findings,
            }])),
            browser: browser && {outcome: browser.outcome, classification: browser.classification,
              original_calls: browser.original_calls, cases: browser.cases?.length,
              screenshots: browser.cases?.filter(row => row.screenshot).length,
              mutations: browser.mutations?.length, page_errors: browser.page_errors?.length},
            cli: cli && {outcome: cli.outcome, classification: cli.classification, version: cli.version,
              original_calls: cli.original_calls, wrong_selector_refusals: cli.cases?.filter(row => row.wrong_selector_refused).length,
              history_mutations: cli.history_mutations},
          };
          const json = `${JSON.stringify(report, null, 2)}\n`;
          writeFileSync(`${process.env.RUNNER_TEMP}/catalog-summary-input/comparison.json`, json);
          process.stdout.write(json);
          NODE
          if [ "$INSPECTION_OUTCOME" != success ]; then
            for name in producer nexus-assertions nexus-waterline-inspection; do
              if [ -f "$DW_NEXUS_RESULT_DIR/$name.log" ]; then
                tail -c 65536 "$DW_NEXUS_RESULT_DIR/$name.log" > "$RUNNER_TEMP/catalog-summary-input/$name-error.log"
              fi
            done
          fi
          node server-summary/scripts/conformance/server-parity/artifact-summary.mjs "$RUNNER_TEMP/catalog-summary-input" "$RUNNER_TEMP/catalog-summary"
      - name: Retain bounded results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-service-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-summary
          if-no-files-found: error
          retention-days: 1
      - name: Remove resources and raw output from this execution
        if: always()
        run: |
          set -euo pipefail
          projects=$(docker ps -a --filter "label=com.docker.compose.project.working_dir=$DW_NEXUS_RUN_ROOT" --format '{{.Label "com.docker.compose.project"}}' | sort -u)
          for project in $projects; do
            [[ "$project" =~ ^dw-nexus-[a-f0-9]{10}$ ]]
            docker rm -f "$project-php-workflow-service" "$project-python-sdk-service" 2>/dev/null || true
            if [ -f "$DW_NEXUS_RUN_ROOT/compose.yml" ]; then
              docker compose -p "$project" -f "$DW_NEXUS_RUN_ROOT/compose.yml" down --volumes --remove-orphans
            else
              docker ps -aq --filter "label=com.docker.compose.project=$project" | xargs -r docker rm -f
              docker volume ls -q --filter "label=com.docker.compose.project=$project" | xargs -r docker volume rm
              docker network ls -q --filter "label=com.docker.compose.project=$project" | xargs -r docker network rm
            fi
          done
          for path in "$DW_NEXUS_RESULT_DIR" "$DW_NEXUS_RUN_ROOT" "$DW_NEXUS_WATERLINE_PLAYWRIGHT_ROOT" "$DW_NEXUS_CLI_HOME" "$RUNNER_TEMP/catalog-cli" "$RUNNER_TEMP/catalog-summary-input" "$RUNNER_TEMP/catalog-summary"; do
            if [ -d "$path" ]; then rm -r -- "$path"; fi
          done
