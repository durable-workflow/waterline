name: Service capacity release tuple

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-tuple:
    name: Live Server to SDK to Waterline tuple
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Check out the first supported Server source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: ${{ github.repository_owner }}/server
          ref: 2.0.0-rc.32
          path: server
          persist-credentials: false

      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Create isolated Composer state
        run: |
          waterline_php_state="$(mktemp -d "$RUNNER_TEMP/waterline-php-check.XXXXXX")"
          mkdir -m 700 "$waterline_php_state/home" "$waterline_php_state/cache" "$waterline_php_state/tmp"
          {
            echo "COMPOSER_HOME=$waterline_php_state/home"
            echo "COMPOSER_CACHE_DIR=$waterline_php_state/cache"
            echo "TMPDIR=$waterline_php_state/tmp"
          } >> "$GITHUB_ENV"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - name: Install PHP and Composer
        # shivammathur/setup-php v2
        uses: durable-workflow/.github/.github/actions/setup-php-linux@411a14ac07d32073eed6ab4977f2825eba4739a7 # bound-linux-php
        with:
          php-version: '8.3'
          ini-file: production
          tools: composer:2.10.3,phpunit:11.5.57
          coverage: none
      - name: Require bound stock PHP extensions
        run: >-
          php -r '$required = ["pdo_sqlite"]; foreach ($required as $extension) {
            if (!extension_loaded($extension)) {
              throw new RuntimeException("Missing required stock extension: ".$extension);
            }
          } echo json_encode(["php" => PHP_VERSION, "required_extensions" => $required]), PHP_EOL;'

      - name: Verify Waterline Composer configuration before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust

      - name: Install the Waterline tuple dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify Server Composer configuration before requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          working-directory: server
      - name: Install the current Server dependencies
        run: >-
          composer install --working-dir=server
          --prefer-dist --no-progress --no-interaction

      - name: Exercise the live capacity-evidence release tuple
        env:
          INTEGRATION_SERVER_SOURCE_PATH: ${{ github.workspace }}/server
        run: >-
          timeout --foreground --signal=TERM --kill-after=10s 5m
          scripts/ci/service-capacity-tuple.sh
