name: build

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.server_url }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify target-branch qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      qualification-class: ${{ steps.classify.outputs.qualification-class }}
      qualification-reason: ${{ steps.classify.outputs.qualification-reason }}
      focused-checks: ${{ steps.classify.outputs.focused-checks }}
      started-at: ${{ steps.clock.outputs.started-at }}

    steps:
    - name: Start qualification clock
      id: clock
      run: echo "started-at=$(date +%s)" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Classify changed paths
      id: classify
      env:
        BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: >-
        python scripts/ci/qualification_policy.py classify
        --event-name="$GITHUB_EVENT_NAME"
        --base="$BASE_SHA"
        --head="$HEAD_SHA"

    - name: Install isolated workflow policy parser
      run: |
        python -m venv "$RUNNER_TEMP/workflow-policy"
        "$RUNNER_TEMP/workflow-policy/bin/python" -m pip install \
          --disable-pip-version-check \
          --no-cache-dir \
          --no-deps \
          --only-binary=:all: \
          --requirement scripts/ci/workflow-requirements.txt

    - name: Validate workflow syntax and trust policy
      run: >-
        "$RUNNER_TEMP/workflow-policy/bin/python"
        scripts/ci/workflow_trust_policy.py

    - name: Verify qualification policy behavior
      run: |
        policy_python="$RUNNER_TEMP/workflow-policy/bin/python"
        "$policy_python" scripts/ci/test-qualification-policy.py
        "$policy_python" scripts/ci/test-database-qualification.py

    - name: Scan the public boundary
      run: scripts/check-public-boundary.sh

  release-contracts:
    name: Release and recovery contracts
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Composer for public package verification
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: '8.3'
        tools: composer
        coverage: none

    - name: Check out the shared target qualification policy
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        repository: durable-workflow/.github
        ref: main
        path: .target-qualification
        persist-credentials: false

    - name: Install the isolated recovery policy parser
      run: |
        python -m venv "$RUNNER_TEMP/recovery-policy"
        "$RUNNER_TEMP/recovery-policy/bin/python" -m pip install \
          --disable-pip-version-check \
          --no-cache-dir \
          --no-deps \
          --only-binary=:all: \
          --requirement scripts/ci/workflow-requirements.txt

    - name: Validate release and recovery tooling
      env:
        CONFORMANCE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        SHARED_TARGET_QUALIFICATION_ROOT: ${{ github.workspace }}/.target-qualification
      run: |
        policy_python="$RUNNER_TEMP/recovery-policy/bin/python"
        "$policy_python" -m py_compile \
          scripts/ci/component-release-recovery.py \
          scripts/ci/publish-planned-tag.py \
          scripts/ci/release_recovery_consumer_conformance.py \
          scripts/ci/service-image-recovery.py \
          scripts/ci/standalone_lock_contract.py \
          scripts/ci/test-component-release-recovery.py \
          scripts/ci/test-publish-planned-tag.py \
          scripts/ci/test-service-image-recovery.py \
          scripts/ci/test-standalone-lock-contract.py
        arguments=()
        if [ -n "$CONFORMANCE_BASE_REF" ]; then
          arguments+=(--previous-ref "$CONFORMANCE_BASE_REF")
        fi
        "$policy_python" scripts/ci/release_recovery_consumer_conformance.py \
          --contract scripts/ci/release-recovery-consumer-contract.json \
          --adapter scripts/ci/release-recovery-consumer-adapter.json \
          "${arguments[@]}"
        "$policy_python" scripts/ci/test-publish-planned-tag.py
        "$policy_python" scripts/ci/test-service-image-recovery.py
        "$policy_python" scripts/ci/test-standalone-lock-contract.py
        "$policy_python" scripts/ci/standalone_lock_contract.py

  conformance-contracts:
    name: Published-artifact conformance contracts
    needs: classify
    if: ${{ github.server_url == 'https://github.com' && needs.classify.outputs.qualification-class == 'conformance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Install PHP and Composer
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: '8.3'
        extensions: pdo_sqlite
        tools: composer
        coverage: none

    - name: Install Node 22
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
      with:
        node-version: '22'

    - name: Install focused PHP test dependencies
      run: >-
        composer install
        --prefer-dist
        --no-progress
        --no-interaction
        --no-scripts

    - name: Check conformance runner syntax
      run: |
        node --check scripts/conformance/worker-status-network.mjs
        node --check scripts/conformance/worker-status-published-artifacts.mjs
        bash -n scripts/conformance/worker-status-published-artifacts.sh
        node --check scripts/conformance/worker-status-runner-lifecycle.mjs
        node --check scripts/conformance/worker-status-shared-isolation.mjs
        node --check scripts/conformance/worker-status-shared-topology.mjs
        node --check scripts/conformance/worker-status-version.mjs
        php -l tests/Unit/WorkerStatusConformanceRunnerTest.php

    - name: Run focused PHP conformance regression
      run: >-
        vendor/bin/phpunit
        --configuration=phpunit-sqlite.xml
        tests/Unit/WorkerStatusConformanceRunnerTest.php

    - name: Run focused Node conformance regressions
      run: >-
        node --test
        tests/Unit/WorkerStatusNetworkTest.mjs
        tests/Unit/WorkerStatusRunnerLifecycleTest.mjs
        tests/Unit/WorkerStatusSharedIsolationTest.mjs
        tests/Unit/WorkerStatusSharedTopologyTest.mjs
        tests/Unit/WorkerStatusVersionTest.mjs

  frontend:
    name: Frontend dependency and production build
    needs: classify
    if: ${{ needs.classify.outputs.qualification-class == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Install Node 22
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
      with:
        node-version: '22'

    - name: Install the locked frontend graph
      run: npm ci

    - name: Audit the frontend graph
      run: npm audit

    - name: Build production frontend assets
      run: npm run production

    - name: Verify committed frontend assets
      run: git diff --exit-code -- public

  build:
    needs: [classify, frontend]
    if: ${{ needs.classify.outputs.qualification-class == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        fetch-depth: 10
        persist-credentials: false

    - name: Install PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: '8.2'
        extensions: pdo_sqlite
        coverage: none
      env:
        fail-fast: true

    - name: Validate Composer manifest
      run: composer validate --strict --no-check-all

    - name: Cache Composer packages
      if: ${{ github.server_url == 'https://github.com' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
      with:
        path: vendor
        key: ${{ github.event_name }}-${{ runner.os }}-php-8.2-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ github.event_name }}-${{ runner.os }}-php-8.2-

    - name: Install maintained qualification dependencies
      if: ${{ github.server_url == 'https://github.com' }}
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Audit qualification dependencies
      if: ${{ github.server_url == 'https://github.com' }}
      run: composer audit --no-interaction

    - name: Build Laravel 12 Workbench scaffold
      if: ${{ github.server_url == 'https://github.com' }}
      run: composer build

  laravel-matrix:
    name: Resolve Laravel dependency matrix
    needs: build
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Install matrix validator PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: '8.3'
        coverage: none

    - name: Validate and export dependency matrix
      id: matrix
      run: |
        php scripts/ci/laravel-matrix.php self-test
        php scripts/ci/laravel-matrix.php export >> "$GITHUB_OUTPUT"

  laravel-compatibility:
    name: ${{ matrix.label }} compatibility
    needs: [build, laravel-matrix]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.laravel-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        fetch-depth: 10
        persist-credentials: false

    - name: Install PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: ${{ matrix.php }}
        extensions: pdo_sqlite
        coverage: none
      env:
        fail-fast: true

    - name: Validate ${{ matrix.label }} dependency contract
      run: >-
        php scripts/ci/laravel-matrix.php validate
        --laravel=${{ matrix.laravel }}
        --testbench=${{ matrix.testbench }}
        --workbench=${{ matrix.workbench }}
        --php=${{ matrix.php }}
        --phpunit=${{ matrix.phpunit }}
        --scaffold=${{ matrix.scaffold }}
        --resolution=${{ matrix.resolution }}

    - name: Cache ${{ matrix.label }} Composer packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
      with:
        path: vendor
        key: >-
          ${{ github.event_name }}-${{ runner.os }}-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-testbench-${{ matrix.testbench }}-workbench-${{ matrix.workbench }}-phpunit-${{ matrix.phpunit }}-${{ hashFiles('composer.json') }}

    - name: Pin ${{ matrix.label }} qualification dependencies
      run: |
        composer require --dev --no-update \
          "laravel/framework:${{ matrix.laravel }}" \
          "orchestra/testbench:${{ matrix.testbench }}" \
          "orchestra/workbench:${{ matrix.workbench }}" \
          "phpunit/phpunit:${{ matrix.phpunit }}"

    - name: Resolve isolated legacy compatibility graph
      if: ${{ matrix.resolution == 'legacy' }}
      env:
        COMPOSER_MEMORY_LIMIT: -1
      run: >-
        composer update
        --with-all-dependencies
        --prefer-dist
        --no-progress
        --no-interaction
        --no-security-blocking

    - name: Resolve isolated current compatibility graph
      if: ${{ matrix.resolution == 'strict' }}
      env:
        COMPOSER_MEMORY_LIMIT: -1
      run: >-
        composer update
        --with-all-dependencies
        --prefer-dist
        --no-progress
        --no-interaction

    - name: Verify installed ${{ matrix.label }} dependency graph
      run: >-
        php scripts/ci/laravel-matrix.php assert-installed
        --laravel=${{ matrix.laravel }}
        --testbench=${{ matrix.testbench }}
        --workbench=${{ matrix.workbench }}
        --php=${{ matrix.php }}
        --phpunit=${{ matrix.phpunit }}
        --scaffold=${{ matrix.scaffold }}
        --resolution=${{ matrix.resolution }}

    - name: Build ${{ matrix.label }} Workbench scaffold
      run: composer build

    - name: Run ${{ matrix.label }} SQLite qualification
      run: composer test-sqlite

  qualification:
    name: Complete database qualification (${{ matrix.label }})
    needs: build
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mssql
            label: mssql
            extension: pdo_sqlsrv
            composer-script: test-mssql
            configuration: phpunit-mssql.xml
            shard-index: 0
            shard-count: 1
            target-seconds: 0
            command_timeout: 15m
            step_timeout: 17
          - database: mysql
            label: mysql shard 1/4
            extension: pdo_mysql
            composer-script: test-mysql
            configuration: phpunit-mysql.xml
            shard-index: 0
            shard-count: 4
            target-seconds: 480
            command_timeout: 7m
            step_timeout: 9
          - database: mysql
            label: mysql shard 2/4
            extension: pdo_mysql
            composer-script: test-mysql
            configuration: phpunit-mysql.xml
            shard-index: 1
            shard-count: 4
            target-seconds: 480
            command_timeout: 7m
            step_timeout: 9
          - database: mysql
            label: mysql shard 3/4
            extension: pdo_mysql
            composer-script: test-mysql
            configuration: phpunit-mysql.xml
            shard-index: 2
            shard-count: 4
            target-seconds: 480
            command_timeout: 7m
            step_timeout: 9
          - database: mysql
            label: mysql shard 4/4
            extension: pdo_mysql
            composer-script: test-mysql
            configuration: phpunit-mysql.xml
            shard-index: 3
            shard-count: 4
            target-seconds: 480
            command_timeout: 7m
            step_timeout: 9
          - database: pgsql
            label: pgsql
            extension: pdo_pgsql
            composer-script: test-pgsql
            configuration: phpunit-pgsql.xml
            shard-index: 0
            shard-count: 1
            target-seconds: 0
            command_timeout: 15m
            step_timeout: 17
          - database: sqlite
            label: sqlite
            extension: pdo_sqlite
            composer-script: test-sqlite
            configuration: phpunit-sqlite.xml
            shard-index: 0
            shard-count: 1
            target-seconds: 0
            command_timeout: 15m
            step_timeout: 17

    services:
      mssql:
        image: ${{ matrix.database == 'mssql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: P@ssword
        ports:
          - 1433:1433
        options: >-
          --tmpfs /var/opt/mssql/data:rw,uid=10001,gid=0,mode=0770,size=2g

      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_USER: testing
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=2g

      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=2g

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Start database qualification clock
      id: qualification-clock
      run: echo "started-at=$(date +%s)" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        fetch-depth: 10
        persist-credentials: false

    - name: Install SQL Server ODBC runtime
      if: ${{ matrix.database == 'mssql' }}
      run: scripts/ci/install-sqlserver-odbc.sh

    - name: Install PHP database drivers
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: '8.2'
        extensions: ${{ matrix.extension }}
        coverage: none
      env:
        fail-fast: true

    - name: Validate Composer manifest
      run: composer validate --strict --no-check-all

    - name: Restore Composer packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
      with:
        path: vendor
        key: ${{ github.event_name }}-${{ runner.os }}-php-8.2-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ github.event_name }}-${{ runner.os }}-php-8.2-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Prepare and verify database connections
      env:
        DB_HOST: 127.0.0.1
      run: php scripts/ci/preflight-databases.php "${{ matrix.database }}" "$DB_HOST"

    - name: Select deterministic test scope
      id: test-scope
      run: >-
        python scripts/ci/qualification_shards.py select
        --configuration="${{ matrix.configuration }}"
        --shard-index="${{ matrix.shard-index }}"
        --shard-count="${{ matrix.shard-count }}"

    - name: Run ${{ matrix.label }} complete test scope
      timeout-minutes: ${{ matrix.step_timeout }}
      env:
        COMMAND_TIMEOUT: ${{ matrix.command_timeout }}
        COMPOSER_SCRIPT: ${{ matrix.composer-script }}
        DATABASE: ${{ matrix.database }}
        DB_HOST: 127.0.0.1
        EXPECTED_TESTS: ${{ steps.test-scope.outputs.expected-tests }}
        QUALIFICATION_FILTER: ${{ steps.test-scope.outputs.test-filter }}
        QUALIFICATION_STARTED_AT: ${{ steps.qualification-clock.outputs.started-at }}
        SELECTED_CLASSES: ${{ steps.test-scope.outputs.selected-classes }}
        SHARD_INDEX: ${{ matrix.shard-index }}
        SHARD_LABEL: ${{ steps.test-scope.outputs.shard-label }}
        TARGET_SECONDS: ${{ matrix.target-seconds }}
      run: |
        test_started_at=$(date +%s)
        junit_report="$RUNNER_TEMP/qualification-${DATABASE}-${SHARD_INDEX}.xml"

        report() {
          status=$?
          trap - EXIT
          set +e
          timing_status=0
          python scripts/ci/qualification_timing.py \
            --database="$DATABASE" \
            --shard-label="$SHARD_LABEL" \
            --expected-tests="$EXPECTED_TESTS" \
            --selected-classes="$SELECTED_CLASSES" \
            --started-at="$QUALIFICATION_STARTED_AT" \
            --test-started-at="$test_started_at" \
            --completed-at="$(date +%s)" \
            --target-seconds="$TARGET_SECONDS" \
            --status="$status" \
            --junit="$junit_report" || timing_status=$?
          if [ "$status" -eq 0 ] && [ "$timing_status" -ne 0 ]; then
            status=$timing_status
          fi
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::$DATABASE test scope exceeded its $COMMAND_TIMEOUT limit"
          fi
          exit "$status"
        }
        trap report EXIT

        arguments=(--log-junit "$junit_report")
        if [ -n "$QUALIFICATION_FILTER" ]; then
          arguments+=(--filter "$QUALIFICATION_FILTER")
        fi
        if [ "$DATABASE" = mysql ]; then
          arguments+=(--stop-on-error --stop-on-failure)
        fi

        timeout --foreground --signal=TERM --kill-after=30s "$COMMAND_TIMEOUT" \
          composer "$COMPOSER_SCRIPT" -- "${arguments[@]}"

  target-branch-qualification:
    name: Target branch qualification
    if: ${{ always() && github.server_url == 'https://github.com' }}
    needs:
      - classify
      - release-contracts
      - conformance-contracts
      - frontend
      - build
      - laravel-matrix
      - laravel-compatibility
      - qualification
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Enforce selected qualification class
      env:
        QUALIFICATION_CLASS: ${{ needs.classify.outputs.qualification-class }}
        CLASSIFICATION_RESULT: ${{ needs.classify.result }}
        RELEASE_CONTRACTS_RESULT: ${{ needs.release-contracts.result }}
        CONFORMANCE_CONTRACTS_RESULT: ${{ needs.conformance-contracts.result }}
        FRONTEND_RESULT: ${{ needs.frontend.result }}
        BUILD_RESULT: ${{ needs.build.result }}
        MATRIX_RESULT: ${{ needs.laravel-matrix.result }}
        LARAVEL_RESULT: ${{ needs.laravel-compatibility.result }}
        DATABASE_RESULT: ${{ needs.qualification.result }}
        QUALIFICATION_STARTED_AT: ${{ needs.classify.outputs.started-at }}
      run: >-
        python scripts/ci/qualification_policy.py gate
        --classification="$QUALIFICATION_CLASS"
        --classification-result="$CLASSIFICATION_RESULT"
        --release-contracts-result="$RELEASE_CONTRACTS_RESULT"
        --conformance-contracts-result="$CONFORMANCE_CONTRACTS_RESULT"
        --frontend-result="$FRONTEND_RESULT"
        --build-result="$BUILD_RESULT"
        --laravel-matrix-result="$MATRIX_RESULT"
        --laravel-compatibility-result="$LARAVEL_RESULT"
        --database-result="$DATABASE_RESULT"
        --started-at="$QUALIFICATION_STARTED_AT"
        --benchmark=.github/qualification-benchmark.json
