name: build

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: build-${{ github.server_url }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 10

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_sqlite
        coverage: none
      env:
        fail-fast: true

    - name: Validate Composer manifest
      run: composer validate --strict

    - name: Cache Composer packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.2-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-8.2-

    - name: Install maintained qualification dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Audit qualification dependencies
      run: composer audit --no-interaction

    - name: Build Laravel 12 Workbench scaffold
      run: composer build

  qualification:
    name: Complete database qualification (${{ matrix.database }})
    needs: build
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mssql
            extension: pdo_sqlsrv
            composer-script: test-mssql
          - database: mysql
            extension: pdo_mysql
            composer-script: test-mysql
          - database: pgsql
            extension: pdo_pgsql
            composer-script: test-pgsql
          - database: sqlite
            extension: pdo_sqlite
            composer-script: test-sqlite

    services:
      mssql:
        image: ${{ matrix.database == 'mssql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: P@ssword
        ports:
          - 1433:1433
        options: >-
          --tmpfs /var/opt/mssql/data:rw,uid=10001,gid=0,mode=0770,size=2g

      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_USER: testing
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=2g

      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=2g

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 10

    - name: Install mssql-tools
      if: ${{ matrix.database == 'mssql' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y curl gnupg2
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev

    - name: Install PHP database drivers
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: ${{ matrix.extension }}
        coverage: none
      env:
        fail-fast: true

    - name: Validate Composer manifest
      run: composer validate --strict

    - name: Restore Composer packages
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.2-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-8.2-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Wait for SQL Server and create databases
      if: ${{ matrix.database == 'mssql' }}
      shell: bash
      run: |
        set -euo pipefail

        sqlcmd=/opt/mssql-tools/bin/sqlcmd
        sql_server_host=
        sql_server_ready=false
        probe_output=
        candidates=(127.0.0.1 host.docker.internal)
        declare -A probe_outputs=()

        for attempt in $(seq 1 30); do
          for candidate in "${candidates[@]}"; do
            if probe_output=$("$sqlcmd" -S "$candidate" -U sa -P "P@ssword" -l 3 -b -Q "SELECT 1;" 2>&1); then
              sql_server_host=$candidate
              sql_server_ready=true
              break 2
            fi

            probe_outputs["$candidate"]=$probe_output
            echo "SQL Server probe ${attempt}/30 failed via ${candidate}"
          done

          sleep 2
        done

        if [ "$sql_server_ready" != true ]; then
          echo "::error::SQL Server did not accept connections via: ${candidates[*]}"
          for candidate in "${candidates[@]}"; do
            echo "Last diagnostic via ${candidate}:"
            printf '%s\n' "${probe_outputs[$candidate]:-(no diagnostic output)}"
          done
          exit 1
        fi

        echo "Using ${sql_server_host} for host-mapped database services"
        echo "DB_HOST=${sql_server_host}" >> "$GITHUB_ENV"
        echo "DB_TRUST_SERVER_CERTIFICATE=true" >> "$GITHUB_ENV"

        "$sqlcmd" -S "$sql_server_host" -U sa -P "P@ssword" -l 3 -b \
          -Q "IF DB_ID(N'testing') IS NULL CREATE DATABASE [testing];"

    - name: Verify database drivers and connections
      env:
        DB_HOST: 127.0.0.1
      run: php scripts/ci/preflight-databases.php "${{ matrix.database }}" "$DB_HOST"

    - name: Run ${{ matrix.database }} test suite
      timeout-minutes: 17
      env:
        DB_HOST: 127.0.0.1
      run: |
        status=0
        if [ "${{ matrix.database }}" = mysql ]; then
          timeout --foreground --signal=TERM --kill-after=30s 15m \
            composer "${{ matrix.composer-script }}" -- --stop-on-error --stop-on-failure || status=$?
        else
          timeout --foreground --signal=TERM --kill-after=30s 15m \
            composer "${{ matrix.composer-script }}" || status=$?
        fi
        if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
          echo "::error::${{ matrix.database }} test suite exceeded its 15-minute limit"
          exit 1
        fi
        exit "$status"
