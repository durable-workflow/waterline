name: Published image qualification

on:
  workflow_call:
    inputs:
      image_digest:
        required: true
        type: string
      release_version:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      publisher_commit:
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact published image index digest (sha256 followed by 64 hex characters)
        required: true
        type: string
      release_version:
        description: Exact stable Waterline 2.x tag
        required: true
        type: string
      source_commit:
        description: Exact commit of that immutable release tag
        required: true
        type: string
      publisher_commit:
        description: Protected main publisher commit that signed the image's build provenance (required after 2.13.2)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  request-budget-scope:
    name: Select published request budget acceptance scope
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.scope.outputs.required }}
      onboarding_required: ${{ steps.scope.outputs.onboarding_required }}
      provenance_required: ${{ steps.scope.outputs.provenance_required }}
    steps:
      - id: scope
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PY'
          import os, re
          match = re.fullmatch(r'2\.(\d+)\.(\d+)', os.environ['RELEASE_VERSION'])
          if match is None:
              raise SystemExit('Expected an exact stable Waterline 2.x version.')
          required = (2, int(match[1]), int(match[2])) >= (2, 13, 1)
          onboarding_required = (2, int(match[1]), int(match[2])) >= (2, 13, 2)
          # 2.13.2 shipped without public provenance; every later release must carry it.
          provenance_required = (2, int(match[1]), int(match[2])) > (2, 13, 2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'required={str(required).lower()}\n')
              output.write(f'onboarding_required={str(onboarding_required).lower()}\n')
              output.write(f'provenance_required={str(provenance_required).lower()}\n')
          PY

  provenance:
    name: Published per-platform provenance
    needs: request-budget-scope
    if: needs.request-budget-scope.outputs.provenance_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      PUBLISHER_COMMIT: ${{ inputs.publisher_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require one attestation manifest and signed provenance per platform
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PUBLISHER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          work="$RUNNER_TEMP/published-provenance"
          mkdir -p "$work/docker"
          printf '%s\n' '{"auths":{}}' > "$work/docker/config.json"
          export DOCKER_CONFIG="$work/docker"
          image=docker.io/durableworkflow/waterline
          docker buildx imagetools inspect --raw "$image@$IMAGE_DIGEST" > "$work/index.json"
          python3 -I scripts/ci/published_provenance.py index --raw "$work/index.json" --digest "$IMAGE_DIGEST" > "$work/platforms.json"
          subjects=("$IMAGE_DIGEST")
          for architecture in amd64 arm64; do
            platform="$(jq -r --arg architecture "$architecture" '.[$architecture].image' "$work/platforms.json")"
            attestation="$(jq -r --arg architecture "$architecture" '.[$architecture].attestation' "$work/platforms.json")"
            docker buildx imagetools inspect --raw "$image@$attestation" > "$work/attestation-$architecture.json"
            python3 -I scripts/ci/published_provenance.py attestation --raw "$work/attestation-$architecture.json" \
              --digest "$attestation" --image "$platform"
            subjects+=("$platform")
          done
          for digest in "${subjects[@]}"; do
            for source in api registry; do
              extra=()
              [[ "$source" = registry ]] && extra=(--bundle-from-oci)
              gh attestation verify "oci://index.docker.io/durableworkflow/waterline@$digest" "${extra[@]}" \
                --repo durable-workflow/waterline \
                --cert-identity https://github.com/durable-workflow/waterline/.github/workflows/service-image-publish.yml@refs/heads/main \
                --source-digest "$PUBLISHER_COMMIT" --deny-self-hosted-runners > /dev/null
              echo "Verified $source provenance for $digest."
            done
          done
          printf 'Published index %s carries BuildKit and GitHub provenance for both platforms.\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  service-request-budget:
    name: Published service request budget and browser recovery
    needs: request-budget-scope
    if: needs.request-budget-scope.outputs.required == 'true'
    uses: ./.github/workflows/request-budget-qualification.yml # local
    with:
      release_version: ${{ inputs.release_version }}
      source_commit: ${{ inputs.source_commit }}

  embedded:
    name: Published Composer consumer and browser
    needs: request-budget-scope
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/2.'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_WATERLINE_VERSION: ${{ inputs.release_version }}
      EXPECTED_WATERLINE_SOURCE: ${{ inputs.source_commit }}
      WATERLINE_ACCEPTANCE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bind the consumer to the immutable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WATERLINE_VERSION" =~ ^2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_WATERLINE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/tags/$EXPECTED_WATERLINE_VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$EXPECTED_WATERLINE_SOURCE"
          mkdir -p "$RUNNER_TEMP/waterline-qualified-source"
          git archive "$EXPECTED_WATERLINE_SOURCE" public composer.json | tar -x -C "$RUNNER_TEMP/waterline-qualified-source"
          printf 'WATERLINE_QUALIFIED_ASSET_ROOT=%s\n' "$RUNNER_TEMP/waterline-qualified-source/public" >> "$GITHUB_ENV"
          printf 'WATERLINE_CONSUMER_ROOT=%s\n' "$RUNNER_TEMP/waterline-consumer" >> "$GITHUB_ENV"
          qualified_workflow="$(jq -er '."require-dev"."durable-workflow/workflow"' "$RUNNER_TEMP/waterline-qualified-source/composer.json")"
          [[ "$qualified_workflow" =~ ^2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'EXPECTED_WORKFLOW_VERSION=%s\n' "$qualified_workflow" >> "$GITHUB_ENV"
      - name: Select Ubuntu's Python 3.12
        run: |
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Create isolated Composer state
        run: |
          waterline_php_state="$(mktemp -d "$RUNNER_TEMP/waterline-php-check.XXXXXX")"
          mkdir -m 700 "$waterline_php_state/home" "$waterline_php_state/cache" "$waterline_php_state/tmp"
          {
            echo "COMPOSER_HOME=$waterline_php_state/home"
            echo "COMPOSER_CACHE_DIR=$waterline_php_state/cache"
            echo "TMPDIR=$waterline_php_state/tmp"
          } >> "$GITHUB_ENV"
      - name: Select authenticated dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - name: Install PHP and Composer
        uses: durable-workflow/.github/.github/actions/setup-php-linux@411a14ac07d32073eed6ab4977f2825eba4739a7 # bound-linux-php
        with:
          php-version: '8.3'
          ini-file: production
          tools: composer:2.10.3,phpunit:11.5.57
          coverage: none
      - name: Require bound stock PHP extensions
        run: >-
          php -r '$required = ["pdo_sqlite"]; foreach ($required as $extension) {
            if (!extension_loaded($extension)) {
              throw new RuntimeException("Missing required stock extension: ".$extension);
            }
          } echo json_encode(["php" => PHP_VERSION, "required_extensions" => $required]), PHP_EOL;'

      - name: Install fixed Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Verify Node version and raw TLS roots
        run: node .devcontainer/docker/verify-node-runtime.mjs
      - name: Prepare the ordinary published consumer
        shell: bash
        run: |
          mkdir -p "$WATERLINE_CONSUMER_ROOT"/{bootstrap/cache,storage/framework/views,storage/logs,public}
          touch "$WATERLINE_CONSUMER_ROOT/database.sqlite"
          cp scripts/ci/published-embedded-host.php "$WATERLINE_CONSUMER_ROOT/host.php"
          php -r '
            $manifest = [
              "name" => "durable-workflow/published-waterline-acceptance",
              "require" => [
                "php" => "^8.3",
                "durable-workflow/waterline" => getenv("EXPECTED_WATERLINE_VERSION"),
                "durable-workflow/workflow" => getenv("EXPECTED_WORKFLOW_VERSION"),
                "laravel/framework" => "12.72.0",
              ],
              "config" => ["allow-plugins" => new stdClass(), "preferred-install" => "dist"],
              "minimum-stability" => "stable",
              "prefer-stable" => true,
            ];
            file_put_contents(getenv("WATERLINE_CONSUMER_ROOT")."/composer.json", json_encode($manifest, JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR).PHP_EOL);
          '
          printf '%s\n' '{"private":true}' > "$WATERLINE_CONSUMER_ROOT/package.json"
      - name: Verify Composer before published package requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
        with:
          working-directory: ${{ env.WATERLINE_CONSUMER_ROOT }}
      - name: Install exact published packages without source overrides
        working-directory: ${{ env.WATERLINE_CONSUMER_ROOT }}
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify Composer before ordinary onboarding requests
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@242c2a7fb23459db2e1ada5f84dbee6d61d9b1e5 # clean-trust
      - name: Require ordinary onboarding to select the exact newly published release
        if: needs.request-budget-scope.outputs.onboarding_required == 'true'
        run: >-
          scripts/ci/check-onboarding-composer.sh
          --candidate-composer "$RUNNER_TEMP/waterline-qualified-source/composer.json"
          --expected-waterline "$EXPECTED_WATERLINE_VERSION"
      - name: Install pinned browser tooling
        working-directory: ${{ env.WATERLINE_CONSUMER_ROOT }}
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.64.0
          npx --no-install playwright install chromium --with-deps
      - name: Seed real outcomes and publish installed assets
        working-directory: ${{ env.WATERLINE_CONSUMER_ROOT }}
        run: |
          mkdir -p published-embedded-evidence
          php host.php seed > published-embedded-evidence/installed-before.json
          php -S 127.0.0.1:8080 host.php > published-embedded-evidence/server.log 2>&1 &
          echo $! > published-embedded-evidence/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/waterline > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Match installed assets to the exact qualified release source
        working-directory: ${{ env.WATERLINE_CONSUMER_ROOT }}
        run: |
          php -r '
            $installed = json_decode(file_get_contents("published-embedded-evidence/installed-before.json"), true, flags: JSON_THROW_ON_ERROR)["assets"];
            $root = getenv("WATERLINE_QUALIFIED_ASSET_ROOT");
            $expected = [];
            foreach (new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS)) as $file) {
              if ($file->isFile()) $expected[substr($file->getPathname(), strlen($root) + 1)] = hash_file("sha256", $file->getPathname());
            }
            ksort($installed);
            ksort($expected);
            if ($installed !== $expected) throw new RuntimeException("Installed browser assets differ from the exact qualified release tag.");
          '
      - name: Exercise installed permissions and actual controls
        working-directory: ${{ env.WATERLINE_CONSUMER_ROOT }}
        run: node "$GITHUB_WORKSPACE/scripts/ci/published-embedded-browser.mjs"
      - name: Measure all installed contrast surfaces
        working-directory: ${{ env.WATERLINE_CONSUMER_ROOT }}
        run: >-
          node "$GITHUB_WORKSPACE/scripts/ci/theme-contrast-visual.mjs"
          --base-url "$WATERLINE_ACCEPTANCE_URL"
          --output-dir published-embedded-evidence/contrast
      - name: Verify stored outcomes after acceptance
        working-directory: ${{ env.WATERLINE_CONSUMER_ROOT }}
        run: |
          php host.php audit > published-embedded-evidence/installed-after.json
          php -r '
            $before = json_decode(file_get_contents("published-embedded-evidence/installed-before.json"), true, flags: JSON_THROW_ON_ERROR);
            $after = json_decode(file_get_contents("published-embedded-evidence/installed-after.json"), true, flags: JSON_THROW_ON_ERROR);
            $commands = $after["commands"];
            $signal = array_pop($commands);
            if ($before["runs"] !== $after["runs"] || $before["assets"] !== $after["assets"] || $after["schedule"] !== "paused" || $commands !== $before["commands"] || ($signal["command_type"] ?? null) !== "signal" || ($signal["status"] ?? null) !== "accepted") {
              throw new RuntimeException("Installed acceptance changed unexpected state or missed the accepted command.");
            }
          '
      - name: Retain installed package and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: waterline-published-embedded-${{ inputs.release_version }}-${{ github.run_id }}
          path: ${{ env.WATERLINE_CONSUMER_ROOT }}/published-embedded-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the acceptance application
        if: always()
        shell: bash
        run: |
          if test -f "$WATERLINE_CONSUMER_ROOT/published-embedded-evidence/server.pid"; then
            kill "$(cat "$WATERLINE_CONSUMER_ROOT/published-embedded-evidence/server.pid")" || true
          fi

  native-browser:
    name: Published browser recovery on ${{ matrix.platform }}
    needs: [request-budget-scope, provenance]
    if: >-
      always() && !cancelled() &&
      needs.request-budget-scope.result == 'success' &&
      needs.request-budget-scope.outputs.onboarding_required == 'true' &&
      (needs.request-budget-scope.outputs.provenance_required != 'true' || needs.provenance.result == 'success')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: aarch64
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      PUBLISHER_COMMIT: ${{ inputs.publisher_commit }}
      EXPECTED_WATERLINE_VERSION: ${{ inputs.release_version }}
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bind native image and immutable release data
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_WATERLINE_VERSION" =~ ^2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          git fetch --no-tags origin "refs/tags/$EXPECTED_WATERLINE_VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$EXPECTED_SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/native-budget" "$RUNNER_TEMP/native-budget-source" "$RUNNER_TEMP/native-budget-docker"
          git archive "$EXPECTED_SOURCE_COMMIT" composer.json standalone/composer.lock | tar -x -C "$RUNNER_TEMP/native-budget-source"
          printf '%s\n' '{"private":true}' > "$RUNNER_TEMP/native-budget/package.json"
          printf '%s\n' '{"auths":{}}' > "$RUNNER_TEMP/native-budget-docker/config.json"
          {
            printf 'NATIVE_BUDGET_ROOT=%s\n' "$RUNNER_TEMP/native-budget"
            printf 'WATERLINE_SOURCE_DATA=%s\n' "$RUNNER_TEMP/native-budget-source"
            printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/native-budget-docker"
            printf 'WATERLINE_IMAGE=durableworkflow/waterline@%s\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Verify raw Node version and trust roots
        run: node .devcontainer/docker/verify-node-runtime.mjs
      - name: Disable APT download retries (CVE-2026-109518)
        if: runner.os == 'Linux'
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - name: Install pinned browser tooling
        working-directory: ${{ env.NATIVE_BUDGET_ROOT }}
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.64.0
          npx --no-install playwright install chromium --with-deps
      - name: Exercise the current published graph, cache and browser phases
        id: ordinary
        if: inputs.release_version == '2.18.1'
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          """Canonical first-stage source for the reviewed ordinary workflow run block.

          This file is not an executable entrypoint. Activation must put these literal
          bytes in the existing trusted workflow step, with one explicit launch call.
          Executing a later mutable copy of this file supplies no launch authority.
          """

          import hashlib
          import os
          from pathlib import Path
          import stat
          import signal


          BOOTSTRAP_SHA256 = "9b3163bed6d15c863098fb64f7ed26895d5cf08c9ca808c855ddb445300c13cd"


          def identity(value):
              return tuple(getattr(value, key) for key in ("st_dev", "st_ino", "st_mode", "st_uid", "st_gid", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns"))


          def root_descriptor(path: Path) -> int:
              if not path.is_absolute() or ".." in path.parts:
                  raise RuntimeError("First-stage root must be an absolute no-follow directory")
              descriptor = os.open("/", os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC)
              try:
                  for component in path.parts[1:]:
                      child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=descriptor)
                      os.close(descriptor)
                      descriptor = child
                      state = os.fstat(descriptor)
                      if not stat.S_ISDIR(state.st_mode) or state.st_uid not in {0, os.getuid()} or state.st_mode & 0o022:
                          raise RuntimeError("First-stage root has an unselected owner or write boundary")
                  return descriptor
              except BaseException:
                  os.close(descriptor)
                  raise


          def bootstrap_bytes(root: int) -> bytes:
              parent = os.dup(root)
              try:
                  for component in ("scripts", "ci"):
                      child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent)
                      os.close(parent)
                      parent = child
                      state = os.fstat(parent)
                      if state.st_uid not in {0, os.getuid()} or state.st_mode & 0o022:
                          raise RuntimeError("First-stage source ancestor is writable by another principal")
                  descriptor = os.open("service_smoke_bootstrap.py", os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent)
                  try:
                      before = os.fstat(descriptor)
                      if (not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid not in {0, os.getuid()}
                              or before.st_mode & 0o022 or not 0 < before.st_size <= 1024 * 1024):
                          raise RuntimeError("First-stage source must be one bounded owned regular file")
                      raw = os.read(descriptor, 1024 * 1024 + 1)
                      if (len(raw) != before.st_size or identity(os.fstat(descriptor)) != identity(before)
                              or hashlib.sha256(raw).hexdigest() != BOOTSTRAP_SHA256):
                          raise RuntimeError("First-stage source substituted before compilation")
                      return raw
                  finally:
                      os.close(descriptor)
              finally:
                  os.close(parent)


          def launch(root: Path, method: str, arguments: dict | None = None):
              selected = {"native": set(), "published": {"producer_gate_succeeded"}, "cleanup": {"contexts"}}
              arguments = {} if arguments is None else arguments
              if method not in selected or not isinstance(arguments, dict) or set(arguments) != selected[method]:
                  raise RuntimeError("Unselected ordinary first-stage call")
              descriptor = root_descriptor(root)
              previous = {}
              try:
                  raw = bootstrap_bytes(descriptor)
                  namespace = {"__name__": "waterline_verified_invocation", "__file__": "<verified ordinary invocation>",
                               "__verified_source__": raw, "__verified_root__": str(root), "__verified_root_fd__": descriptor}

                  def scope_check():
                      if namespace.get("__ordinary_cancelled__") is True:
                          raise InterruptedError("Ordinary work was cancelled; only owned cleanup remains available")

                  def interrupted(number, _frame):
                      namespace["__ordinary_cancelled__"] = True
                      signal.signal(number, signal.SIG_IGN)
                      raise InterruptedError("Ordinary invocation interrupted")

                  namespace["__scope_check__"] = scope_check
                  for number in (signal.SIGINT, signal.SIGTERM):
                      previous[number] = signal.getsignal(number)
                      signal.signal(number, interrupted)
                  exec(compile(raw, "<verified ordinary invocation>", "exec"), namespace)
                  return namespace[method](**arguments)
              finally:
                  for number, handler in previous.items():
                      signal.signal(number, handler)
                  os.close(descriptor)

          launch(Path(os.environ["GITHUB_WORKSPACE"]), "published", {"producer_gate_succeeded": True})
          PY
      - name: Exercise historical native image UI, SDK bounds and safe recovery
        if: inputs.release_version != '2.18.1'
        run: bash scripts/ci/request-budget-native.sh
      - name: Independently remove owned ordinary acceptance roles
        if: >-
          always() && steps.ordinary.outputs.ordinary_code_root != '' &&
          (steps.ordinary.outputs.ordinary_primary_run != '' || steps.ordinary.outputs.ordinary_automatic_run != '')
        env:
          ORDINARY_CODE_ROOT: ${{ steps.ordinary.outputs.ordinary_code_root }}
          ORDINARY_PRIMARY_RUN: ${{ steps.ordinary.outputs.ordinary_primary_run }}
          ORDINARY_PRIMARY_IMAGE: ${{ steps.ordinary.outputs.ordinary_primary_image }}
          ORDINARY_PRIMARY_ARCHITECTURE: ${{ steps.ordinary.outputs.ordinary_primary_architecture }}
          ORDINARY_AUTOMATIC_RUN: ${{ steps.ordinary.outputs.ordinary_automatic_run }}
          ORDINARY_AUTOMATIC_IMAGE: ${{ steps.ordinary.outputs.ordinary_automatic_image }}
          ORDINARY_AUTOMATIC_ARCHITECTURE: ${{ steps.ordinary.outputs.ordinary_automatic_architecture }}
        shell: bash
        run: |
          python3 -I -S - <<'PY'
          """Canonical first-stage source for the reviewed ordinary workflow run block.

          This file is not an executable entrypoint. Activation must put these literal
          bytes in the existing trusted workflow step, with one explicit launch call.
          Executing a later mutable copy of this file supplies no launch authority.
          """

          import hashlib
          import os
          from pathlib import Path
          import stat
          import signal


          BOOTSTRAP_SHA256 = "9b3163bed6d15c863098fb64f7ed26895d5cf08c9ca808c855ddb445300c13cd"


          def identity(value):
              return tuple(getattr(value, key) for key in ("st_dev", "st_ino", "st_mode", "st_uid", "st_gid", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns"))


          def root_descriptor(path: Path) -> int:
              if not path.is_absolute() or ".." in path.parts:
                  raise RuntimeError("First-stage root must be an absolute no-follow directory")
              descriptor = os.open("/", os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC)
              try:
                  for component in path.parts[1:]:
                      child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=descriptor)
                      os.close(descriptor)
                      descriptor = child
                      state = os.fstat(descriptor)
                      if not stat.S_ISDIR(state.st_mode) or state.st_uid not in {0, os.getuid()} or state.st_mode & 0o022:
                          raise RuntimeError("First-stage root has an unselected owner or write boundary")
                  return descriptor
              except BaseException:
                  os.close(descriptor)
                  raise


          def bootstrap_bytes(root: int) -> bytes:
              parent = os.dup(root)
              try:
                  for component in ("scripts", "ci"):
                      child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent)
                      os.close(parent)
                      parent = child
                      state = os.fstat(parent)
                      if state.st_uid not in {0, os.getuid()} or state.st_mode & 0o022:
                          raise RuntimeError("First-stage source ancestor is writable by another principal")
                  descriptor = os.open("service_smoke_bootstrap.py", os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=parent)
                  try:
                      before = os.fstat(descriptor)
                      if (not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid not in {0, os.getuid()}
                              or before.st_mode & 0o022 or not 0 < before.st_size <= 1024 * 1024):
                          raise RuntimeError("First-stage source must be one bounded owned regular file")
                      raw = os.read(descriptor, 1024 * 1024 + 1)
                      if (len(raw) != before.st_size or identity(os.fstat(descriptor)) != identity(before)
                              or hashlib.sha256(raw).hexdigest() != BOOTSTRAP_SHA256):
                          raise RuntimeError("First-stage source substituted before compilation")
                      return raw
                  finally:
                      os.close(descriptor)
              finally:
                  os.close(parent)


          def launch(root: Path, method: str, arguments: dict | None = None):
              selected = {"native": set(), "published": {"producer_gate_succeeded"}, "cleanup": {"contexts"}}
              arguments = {} if arguments is None else arguments
              if method not in selected or not isinstance(arguments, dict) or set(arguments) != selected[method]:
                  raise RuntimeError("Unselected ordinary first-stage call")
              descriptor = root_descriptor(root)
              previous = {}
              try:
                  raw = bootstrap_bytes(descriptor)
                  namespace = {"__name__": "waterline_verified_invocation", "__file__": "<verified ordinary invocation>",
                               "__verified_source__": raw, "__verified_root__": str(root), "__verified_root_fd__": descriptor}

                  def scope_check():
                      if namespace.get("__ordinary_cancelled__") is True:
                          raise InterruptedError("Ordinary work was cancelled; only owned cleanup remains available")

                  def interrupted(number, _frame):
                      namespace["__ordinary_cancelled__"] = True
                      signal.signal(number, signal.SIG_IGN)
                      raise InterruptedError("Ordinary invocation interrupted")

                  namespace["__scope_check__"] = scope_check
                  for number in (signal.SIGINT, signal.SIGTERM):
                      previous[number] = signal.getsignal(number)
                      signal.signal(number, interrupted)
                  exec(compile(raw, "<verified ordinary invocation>", "exec"), namespace)
                  return namespace[method](**arguments)
              finally:
                  for number, handler in previous.items():
                      signal.signal(number, handler)
                  os.close(descriptor)

          contexts = []
          if os.environ['ORDINARY_PRIMARY_RUN']:
              contexts.append({key: os.environ['ORDINARY_PRIMARY_' + key.upper()] for key in ("run", "image", "architecture")})
          if os.environ['ORDINARY_AUTOMATIC_RUN']:
              contexts.append({key: os.environ['ORDINARY_AUTOMATIC_' + key.upper()] for key in ("run", "image", "architecture")})
          launch(Path(os.environ["ORDINARY_CODE_ROOT"]), "cleanup", {"contexts": contexts})
          PY
      - name: Retain native browser and SDK identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: waterline-published-browser-${{ matrix.machine }}-${{ github.run_id }}
          path: ${{ env.NATIVE_BUDGET_ROOT }}/request-budget-evidence
          if-no-files-found: warn
          retention-days: 7

  qualify:
    name: Published image on ${{ matrix.platform }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/2.'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: aarch64
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      EXPECTED_WATERLINE_VERSION: ${{ inputs.release_version }}
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bind the image, release tag and native runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_WATERLINE_VERSION" =~ ^2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          git fetch --no-tags origin "refs/tags/$EXPECTED_WATERLINE_VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$EXPECTED_SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/waterline-docker-anonymous"
          printf '%s\n' '{"auths":{}}' > "$RUNNER_TEMP/waterline-docker-anonymous/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/waterline-docker-anonymous" >> "$GITHUB_ENV"
          printf 'WATERLINE_IMAGE=durableworkflow/waterline@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_ENV"
      - name: Exercise the actual published image through its PHP SDK
        env:
          SERVICE_IMAGE_SKIP_BUILD: '1'
        run: scripts/ci/service-mode-image-smoke.sh
      - name: Match package and served image assets to the exact release source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/waterline-qualified-source"
          git archive "$EXPECTED_SOURCE_COMMIT" public | tar -x -C "$RUNNER_TEMP/waterline-qualified-source"
          docker run --rm --network none --user 1000:1000 --cpus 1 --memory 256m \
            --tmpfs /data:rw,uid=1000,gid=1000,size=1m \
            --entrypoint php "$WATERLINE_IMAGE" -r '
              $assets = [];
              foreach (["package" => "/app/waterline/public", "served" => "/app/public/vendor/waterline"] as $kind => $root) {
                foreach (new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS)) as $file) {
                  if ($file->isFile()) $assets[$kind][substr($file->getPathname(), strlen($root) + 1)] = hash_file("sha256", $file->getPathname());
                }
              }
              echo json_encode($assets, JSON_THROW_ON_ERROR).PHP_EOL;
            ' > "$RUNNER_TEMP/waterline-published-assets.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'waterline-qualified-source/public'
          expected = {str(file.relative_to(root)): hashlib.sha256(file.read_bytes()).hexdigest() for file in root.rglob('*') if file.is_file()}
          receipt = Path(os.environ['RUNNER_TEMP']) / 'waterline-published-assets.json'
          actual = json.loads(receipt.read_text())
          if actual.get('package') != expected or actual.get('served') != expected:
              raise SystemExit('Published image browser assets differ from the exact release source.')
          receipt.write_text(json.dumps({'source': os.environ['EXPECTED_SOURCE_COMMIT'], 'version': os.environ['EXPECTED_WATERLINE_VERSION'], 'image': os.environ['WATERLINE_IMAGE'], 'platform': os.environ['EXPECTED_PLATFORM'], 'assets': actual}, indent=2) + '\n')
          print(f'Verified all {len(expected)} package and served browser assets against the exact release source.')
          PY
      - name: Retain published image asset identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: waterline-published-assets-${{ matrix.machine }}-${{ github.run_id }}
          path: ${{ runner.temp }}/waterline-published-assets.json
          if-no-files-found: warn
          retention-days: 7
      - name: Record the qualified artifact
        shell: bash
        run: |
          printf '%s\n' \
            "Published Waterline $EXPECTED_WATERLINE_VERSION passed on native $EXPECTED_PLATFORM." \
            "Image: durableworkflow/waterline@$IMAGE_DIGEST" \
            "Source: $EXPECTED_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
